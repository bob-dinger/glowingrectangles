<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Fretboard - Glowing Gardens</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            z-index: 100;
        }
        .back-link:hover { color: #fff; }

        .main {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 280px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            color: #fff;
        }

        .fretboard {
            background: linear-gradient(180deg, #2d1810 0%, #1a0f0a 100%);
            border-radius: 8px;
            padding: 20px 30px;
            position: relative;
        }

        .fret-numbers {
            display: flex;
            margin-bottom: 10px;
            padding-left: 40px;
        }

        .fret-number {
            text-align: center;
            font-size: 10px;
            color: #666;
        }

        .strings {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .string-row {
            display: flex;
            align-items: center;
        }

        .string-label {
            width: 40px;
            font-size: 14px;
            font-weight: 600;
            color: #888;
            text-align: center;
        }

        .frets {
            display: flex;
            position: relative;
        }

        .fret {
            height: 28px;
            border-right: 2px solid #8b7355;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .fret:first-child {
            border-left: 4px solid #f5f5dc;
            /* the nut: thicker bone-colored line between fret 0 (open) and fret 1 */
            border-right: 5px solid #ede4cf;
        }

        .string-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #d4a574, #c9a067);
            pointer-events: none;
        }

        .string-row:nth-child(1) .string-line { height: 1px; }
        .string-row:nth-child(2) .string-line { height: 1.5px; }
        .string-row:nth-child(3) .string-line { height: 2px; }
        .string-row:nth-child(4) .string-line { height: 2.5px; }
        .string-row:nth-child(5) .string-line { height: 3px; }
        .string-row:nth-child(6) .string-line { height: 3.5px; }

        .note {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
            z-index: 1;
            opacity: 0.15;
            transition: all 0.15s;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .note:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .note.active {
            opacity: 1;
            transform: scale(1.3);
            box-shadow: 0 0 20px currentColor;
        }

        .note.highlight {
            opacity: 1;
        }

        /* Note colors */
        .note-C { background: #EF4444; color: #fff; }
        .note-D { background: #F97316; color: #fff; }
        .note-E { background: #EAB308; color: #000; }
        .note-F { background: #22C55E; color: #fff; }
        .note-G { background: #3B82F6; color: #fff; }
        .note-A { background: #8B5CF6; color: #fff; }
        .note-B { background: #EC4899; color: #fff; }
        .note-sharp { background: #64748b; color: #fff; }  /* accidentals (like piano black keys) */

        /* Fret markers */
        .fret-markers {
            display: flex;
            padding-left: 40px;
            margin-top: 10px;
        }

        .fret-marker {
            display: flex;
            justify-content: center;
        }

        .fret-marker .dot {
            width: 8px;
            height: 8px;
            background: #444;
            border-radius: 50%;
        }

        .fret-marker.double .dot {
            width: 6px;
            height: 6px;
        }

        .fret-marker.double {
            gap: 8px;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .control-btn {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        .control-btn:hover {
            background: #333;
        }

        .control-btn.active {
            background: #3B82F6;
            border-color: #3B82F6;
        }

        .transpose-controls {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .transpose-btn {
            width: 40px;
            height: 32px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: 1px solid #333;
            transition: all 0.2s;
        }

        .transpose-btn:hover {
            background: #3B82F6;
            border-color: #3B82F6;
        }

        .transpose-label {
            font-size: 13px;
            color: #888;
            min-width: 100px;
            text-align: center;
        }

        .transpose-label span {
            color: #3B82F6;
            font-weight: 600;
        }

        .legend {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #888;
        }

        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 260px;
            height: 100vh;
            background: #0f0f14;
            border-left: 1px solid #222;
            overflow-y: auto;
            padding: 25px;
            z-index: 50;
        }

        .sidebar h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #3B82F6;
        }

        .sidebar p {
            color: #888;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .song-btn {
            padding: 12px 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .song-btn:hover {
            border-color: #3B82F6;
        }

        .song-btn.playing {
            border-color: #22C55E;
            background: #22C55E22;
        }

        .song-btn .song-title {
            font-weight: 600;
        }

        .song-btn .song-info {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        /* Scrubber */
        .scrubber-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            width: 400px;
        }

        .scrubber {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: #333;
            border-radius: 3px;
            cursor: pointer;
        }

        .scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #F59E0B;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
        }

        .scrubber::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #F59E0B;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .scrubber-label {
            font-size: 12px;
            color: #888;
            min-width: 35px;
            text-align: center;
        }

        @media (max-width: 1100px) {
            .main { padding-right: 0; }
            .sidebar { display: none; }
        }
    
        /* ---- Position boxes ---- */
        .note.pos-off { opacity: .10 !important; }
        #positionBar { display:none; gap:6px; justify-content:center; align-items:center;
            flex-wrap:wrap; margin-top:12px; }
        #positionBar .lbl { color:#888; font-size:12px; margin-right:2px; }
        .pos-btn { background:#222; color:#ddd; border:1px solid #333; border-radius:6px;
            padding:5px 9px; font-size:13px; cursor:pointer; display:flex; flex-direction:column;
            align-items:center; line-height:1.15; font-family:inherit; }
        .pos-btn span { font-size:9px; color:#777; margin-top:1px; }
        .pos-btn:hover { border-color:#666; }
        .pos-btn.on { background:#3b82f6; border-color:#3b82f6; color:#fff; }
        .pos-btn.on span { color:#dbeafe; }
    </style>
</head>

    <script>
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const strings = ['E', 'B', 'G', 'D', 'A', 'E']; // High to low
        const stringNotes = [4, 11, 7, 2, 9, 4]; // Starting note index for each string
        const fretCount = 21; // 0-20

        const fretMarkersPos = [3, 5, 7, 9, 12, 15, 17, 19];
        const doubleDots = [12];

        // Calculate realistic fret widths (each fret is 94.387% of the previous)
        const fretRatio = 1 / Math.pow(2, 1/12); // ≈ 0.94387
        const baseFretWidth = 58; // Width of first fret in pixels
        const fretWidths = [];
        for (let i = 0; i < fretCount; i++) {
            fretWidths.push(baseFretWidth * Math.pow(fretRatio, i));
        }

        function getNoteAt(stringIdx, fret) {
            const startNote = stringNotes[stringIdx];
            return notes[(startNote + fret) % 12];
        }

        function getBaseNote(note) {
            return note.replace('#', '');
        }

        function buildFretboard() {
            // Fret numbers
            const fretNumbersEl = document.getElementById('fretNumbers');
            fretNumbersEl.innerHTML = Array.from({length: fretCount}, (_, i) =>
                `<div class="fret-number" style="width: ${fretWidths[i]}px">${i}</div>`
            ).join('');

            // Strings
            const stringsEl = document.getElementById('strings');
            stringsEl.innerHTML = strings.map((stringName, stringIdx) => {
                const frets = Array.from({length: fretCount}, (_, fret) => {
                    const note = getNoteAt(stringIdx, fret);
                    const baseNote = getBaseNote(note);
                    const displayNote = note;
                    const noteClass = note.includes('#') ? 'note-sharp' : `note-${baseNote}`;
                    return `
                        <div class="fret" style="width: ${fretWidths[fret]}px">
                            <div class="string-line"></div>
                            <div class="note ${noteClass}" data-note="${note}" data-string="${stringIdx}" data-fret="${fret}">
                                ${displayNote}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="string-row">
                        <div class="string-label">${stringName}</div>
                        <div class="frets">${frets}</div>
                    </div>
                `;
            }).join('');

            // Fret markers
            const fretMarkersEl = document.getElementById('fretMarkers');
            fretMarkersEl.innerHTML = Array.from({length: fretCount}, (_, i) => {
                if (doubleDots.includes(i)) {
                    return `<div class="fret-marker double" style="width: ${fretWidths[i]}px"><div class="dot"></div><div class="dot"></div></div>`;
                } else if (fretMarkersPos.includes(i)) {
                    return `<div class="fret-marker" style="width: ${fretWidths[i]}px"><div class="dot"></div></div>`;
                }
                return `<div class="fret-marker" style="width: ${fretWidths[i]}px"></div>`;
            }).join('');
        }

        function showAll() {
            clearScale();
            document.querySelectorAll('.note').forEach(n => n.classList.add('highlight'));
        }

        function hideAll() {
            document.querySelectorAll('.note').forEach(n => n.classList.remove('highlight', 'active'));
        }

        function showNote(note) {
            clearScale();
            hideAll();
            document.querySelectorAll('.note').forEach(n => {
                if (getBaseNote(n.dataset.note) === note) {
                    n.classList.add('highlight');
                }
            });
        }

        // ---- Scale display: major scale coloured by degree (root=red .. 7th=pink) ----
        const LETTERS = ['C','D','E','F','G','A','B'];
        const LETTER_PC = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
        const MAJOR_INTERVALS = [0,2,4,5,7,9,11];
        const DEGREE_COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#a855f7','#ec4899']; // 1..7
        const DEGREE_TEXT   = ['#fff','#1a1a2e','#1a1a2e','#1a1a2e','#fff','#fff','#fff'];             // dark on orange/yellow/green

        function pcOfName(name) {                 // sharp-spelled note like 'C#'
            let pc = LETTER_PC[name[0]];
            if (name.includes('#')) pc += 1;
            return ((pc % 12) + 12) % 12;
        }
        function spellMajorScale(rootName) {      // -> [{pc, name, degree}] with correct #/b spelling
            const acc = rootName.slice(1);
            const rootPc = ((LETTER_PC[rootName[0]] + (acc === '#' ? 1 : acc === 'b' ? -1 : 0)) % 12 + 12) % 12;
            const rootLi = LETTERS.indexOf(rootName[0]);
            const out = [];
            for (let i = 0; i < 7; i++) {
                const letter = LETTERS[(rootLi + i) % 7];
                const targetPc = (rootPc + MAJOR_INTERVALS[i]) % 12;
                const diff = ((targetPc - LETTER_PC[letter]) % 12 + 12) % 12;
                const a = diff === 0 ? '' : diff === 1 ? '#' : diff === 11 ? 'b' : diff === 2 ? '##' : diff === 10 ? 'bb' : '';
                out.push({ pc: targetPc, name: letter + a, degree: i + 1 });
            }
            return out;
        }

        let currentScale = null;
        function showScale(rootName) {
            clearScaleStyles();
            if (!rootName) { currentScale = null; document.getElementById('scaleLegend').style.display = 'none'; return; }
            currentScale = rootName;
            hideAll();
            const scale = spellMajorScale(rootName);
            const byPc = {}; scale.forEach(s => byPc[s.pc] = s);
            document.querySelectorAll('.note').forEach(n => {
                const s = byPc[pcOfName(n.dataset.note)];
                if (s) {
                    n.classList.add('highlight');
                    n.style.background = DEGREE_COLORS[s.degree - 1];
                    n.style.color = DEGREE_TEXT[s.degree - 1];
                    n.textContent = s.name;
                    n.dataset.scaleOn = '1';
                } else {
                    n.classList.remove('highlight', 'active');
                }
            });
            const el = document.getElementById('scaleLegend');
            el.style.display = 'flex';
            el.innerHTML = `<div class="legend-item" style="color:#aaa;font-weight:600;margin-right:4px;">${rootName} major</div>` +
                scale.map(s => `<div class="legend-item"><div class="legend-dot" style="background:${DEGREE_COLORS[s.degree-1]}"></div>${s.degree} ${s.name}</div>`).join('');

        // ---- Position boxes: the seven three-notes-per-string shapes ----
        // Standard tuning as MIDI, indexed to match `strings` (high E .. low E).
        const OPEN_MIDI = [64, 59, 55, 50, 45, 40];
        let POSITIONS = [];        // each entry: Set of "stringIdx:fret"
        let activePosition = -1;

        function buildPositions(rootName) {
            POSITIONS = [];
            activePosition = -1;
            document.querySelectorAll('.note').forEach(n => n.classList.remove('pos-off'));
            const bar = document.getElementById('positionBar');
            if (!rootName) { bar.style.display = 'none'; return; }

            const pcs = spellMajorScale(rootName).map(s => s.pc);
            const inScale = m => pcs.includes(((m % 12) + 12) % 12);

            // Every scale note on the low E string; the first seven are the position roots.
            const lowE = [];
            for (let f = 0; f < fretCount; f++) if (inScale(OPEN_MIDI[5] + f)) lowE.push(f);

            for (let p = 0; p < 7 && p < lowE.length; p++) {
                const cells = new Set();
                let pitch = OPEN_MIDI[5] + lowE[p];
                let ok = true;
                // Walk the scale upward, three notes per string, low E to high E.
                for (let s = 5; s >= 0 && ok; s--) {
                    for (let k = 0; k < 3; k++) {
                        const fret = pitch - OPEN_MIDI[s];
                        if (fret < 0 || fret >= fretCount) { ok = false; break; }
                        cells.add(s + ':' + fret);
                        do { pitch++; } while (!inScale(pitch));
                    }
                }
                if (ok) POSITIONS.push(cells);
            }
            renderPositionBar();
        }

            bar.style.display = 'flex';

                    const fr = [...c].map(x => +x.split(':')[1]);
                    return `<button class="pos-btn" data-pos="${i}" onclick="showPosition(${i})">` +
                           `${i + 1}<span>${Math.min(...fr)}\u2013${Math.max(...fr)}</span></button>`;

            osc.frequency.value = midiToFreq(midi);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration / 1000);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration / 1000);
        }

        let playing = false;
        let paused = false;
        let currentTimeout = null;
        let transpose = 0;
        let showAlternatives = false;
        let currentSongName = null;
        let currentSong = null;
        let currentNoteIndex = 0;
        let lastPosition = null; // Track hand position for smart fingering

        function changeTranspose(delta) {
            transpose += delta;
            document.getElementById('transposeValue').textContent = (transpose >= 0 ? '+' : '') + transpose;
        }

        function toggleAlternatives() {
            showAlternatives = !showAlternatives;
            document.getElementById('altBtn').classList.toggle('active', showAlternatives);
        }

        // String tuning for transpose calculations (high E to low E)
        const string_tuning = [64, 59, 55, 50, 45, 40];

        function getTransposedGuitarPos(midi, prevPosition = null) {
            const transposedMidi = midi + transpose;
            const positions = getAllPositions(transposedMidi);

            if (positions.length === 0) return null;

            // If no previous position, pick middle-of-neck default (prefer frets 3-7)
            if (!prevPosition) {
                const midFret = positions.reduce((best, pos) => {
                    const bestDist = Math.abs(best.fret - 5);
                    const posDist = Math.abs(pos.fret - 5);
                    return posDist < bestDist ? pos : best;
                }, positions[0]);
                return { ...midFret, midi: transposedMidi };
            }

            // Find position closest to previous note (minimize hand movement).
            // Fret proximity dominates: a nearby fret on another string beats the
            // same string several frets away (string is only a minor tiebreaker).
            const closest = positions.reduce((best, pos) => {
                const bestDist = Math.abs(best.fret - prevPosition.fret) * 2 + Math.abs(best.string - prevPosition.string);
                const posDist = Math.abs(pos.fret - prevPosition.fret) * 2 + Math.abs(pos.string - prevPosition.string);
                return posDist < bestDist ? pos : best;
            }, positions[0]);

            return { ...closest, midi: transposedMidi };
        }

        function getAllPositions(midi) {
            // Find ALL positions where this note can be played
            const positions = [];
            for (let stringIdx = 0; stringIdx < string_tuning.length; stringIdx++) {
                const openNote = string_tuning[stringIdx];
                const fret = midi - openNote;
                if (fret >= 0 && fret <= 20) {
                    positions.push({ string: stringIdx, fret: fret });
                }
            }
            return positions;
        }

        function playSong(name) {
            initAudio();
            clearScale();

            // If clicking same song while playing, toggle pause
            if (playing && currentSongName === name) {
                pausePlay();
                return;
            }

            // If clicking different song, stop current and start new
            if (playing || paused) {
                stopPlaying();
            }

            const song = songs[name];
            if (!song) return;

            currentSongName = name;
            currentSong = song;
            currentNoteIndex = 0;
            lastPosition = null; // Reset hand position for new song
            playing = true;
            paused = false;

            updatePlaybackUI();
            showMainScrubber();
            hideAll();
            playFromCurrentPosition();
        }

        function playFromCurrentPosition() {
            if (!playing || paused || currentNoteIndex >= currentSong.length) {
                if (currentNoteIndex >= currentSong.length) {
                    stopPlaying();
                }
                return;
            }

            resetShowAll();
            hideAll();
            const note = currentSong[currentNoteIndex];
            if (note) {
                const [string, fret, midi, delay] = note;

                let playString = string;
                let playFret = fret;
                let playMidi = midi;

                // Only recalculate position if transposing
                if (transpose !== 0) {
                    const shifted = fret + transpose;
                    if (shifted >= 0 && shifted <= 20) {
                        // slide the stored shape along the neck (keeps it vertical)
                        playString = string; playFret = shifted; playMidi = midi + transpose;
                    } else {
                        const transposed = getTransposedGuitarPos(midi, lastPosition);
                        if (transposed) {
                            playString = transposed.string;
                            playFret = transposed.fret;
                            playMidi = transposed.midi;
                        } else {
                            playMidi = midi + transpose;
                        }
                    }
                }

                // Track hand position for smart fingering
                lastPosition = { string: playString, fret: playFret };

                // Update main scrubber
                updateScrubber();

                // Show the main note
                const noteEl = document.querySelector(`.note[data-string="${playString}"][data-fret="${playFret}"]`);
                if (noteEl) {
                    noteEl.classList.add('active');
                }

                // Show alternative positions (same pitch, different location)
                if (showAlternatives) {
                    const altPositions = getAllPositions(playMidi);
                    altPositions.forEach(pos => {
                        if (pos.string !== playString || pos.fret !== playFret) {
                            const altEl = document.querySelector(`.note[data-string="${pos.string}"][data-fret="${pos.fret}"]`);
                            if (altEl) {
                                altEl.classList.add('highlight');
                            }
                        }
                    });
                }

                // Play the sound
                playNote(playMidi, Math.min(delay || 400, 500));

                currentNoteIndex++;
                currentTimeout = setTimeout(playFromCurrentPosition, delay || 400);
            } else {
                currentNoteIndex++;
                currentTimeout = setTimeout(playFromCurrentPosition, 400);
            }
        }

        function pausePlay() {
            if (playing && !paused) {
                paused = true;
                playing = false;
                clearTimeout(currentTimeout);
                updatePlaybackUI();

        function updateScrubber() {
            if (!currentSong) return;
            document.getElementById('mainScrubber').value = currentNoteIndex;
            document.getElementById('mainScrubberPos').textContent = currentNoteIndex + 1;

        function showMainScrubber() {
            if (!currentSong) return;
            const container = document.getElementById('scrubberContainer');
            const scrubber = document.getElementById('mainScrubber');
            container.style.display = 'flex';
            scrubber.max = currentSong.length - 1;
            scrubber.value = currentNoteIndex;
            document.getElementById('mainScrubberPos').textContent = currentNoteIndex + 1;
            document.getElementById('mainScrubberTotal').textContent = currentSong.length;

        function hideMainScrubber() {
            document.getElementById('scrubberContainer').style.display = 'none';
        }

        function scrubToMain(value) {
            if (!currentSong) return;
            const index = parseInt(value);
            currentNoteIndex = index;
            document.getElementById('mainScrubberPos').textContent = index + 1;

            // Show the note on fretboard
            hideAll();
            const [string, fret, midi] = currentSong[index];
            const noteEl = document.querySelector(`.note[data-string="${string}"][data-fret="${fret}"]`);
            if (noteEl) noteEl.classList.add('active');

            // Play sound
            initAudio();
            playNote(midi, 300);
        }

        // Step through the song one note at a time (manual walkthrough)
        function stepNote(delta) {
            if (!currentSong && currentSongName && songs[currentSongName]) {
                currentSong = songs[currentSongName];
            }
            if (!currentSong || !currentSong.length) return;
            // stepping is manual — halt any auto-play
            if (playing) {
                playing = false; paused = true;
                clearTimeout(currentTimeout);
                updatePlaybackUI();
            }
            initAudio();
            currentNoteIndex = Math.max(0, Math.min(currentNoteIndex + delta, currentSong.length - 1));
            resetShowAll();
            showMainScrubber();
            hideAll();
            const [string, fret, midi] = currentSong[currentNoteIndex];
            let ps = string, pf = fret, pm = midi;
            if (transpose !== 0) {
                const shifted = fret + transpose;
                if (shifted >= 0 && shifted <= 20) {
                    ps = string; pf = shifted; pm = midi + transpose;
                } else {
                    const t = getTransposedGuitarPos(midi, lastPosition);
                    if (t) { ps = t.string; pf = t.fret; pm = t.midi; }
                    else { pm = midi + transpose; }
                }
            }
            lastPosition = { string: ps, fret: pf };
            const noteEl = document.querySelector(`.note[data-string="${ps}"][data-fret="${pf}"]`);
            if (noteEl) noteEl.classList.add('active');
            playNote(pm, 300);
            updateScrubber();
        }

        // Toggle: light up every fret position used in the current riff at once
        let showingAll = false;
        function showAllNotes() {
            if (!currentSong && currentSongName && songs[currentSongName]) {
                currentSong = songs[currentSongName];
            }
            if (!currentSong || !currentSong.length) return;
            if (playing) {
                playing = false; paused = true;
                clearTimeout(currentTimeout);
                updatePlaybackUI();
            }
            hideAll();
            showingAll = !showingAll;
            const btn = document.getElementById('showAllBtn');
            if (btn) btn.classList.toggle('active', showingAll);
            if (!showingAll) return;
            currentSong.forEach(([string, fret, midi]) => {
                let s = string, f = fret;
                if (transpose !== 0) {
                    const shifted = fret + transpose;
                    if (shifted >= 0 && shifted <= 20) { f = shifted; }
                    else {
                        const t = getTransposedGuitarPos(midi, null);
                        if (t) { s = t.string; f = t.fret; }
                    }
                }
                const el = document.querySelector(`.note[data-string="${s}"][data-fret="${f}"]`);
                if (el) el.classList.add('highlight');
            });
        }

        function resetShowAll() {
            if (!showingAll) return;
            showingAll = false;
            const b = document.getElementById('showAllBtn');
            if (b) b.classList.remove('active');
        }

        function resumePlay() {
            initAudio();
            if (paused && currentSong) {
                paused = false;
                playing = true;
                updatePlaybackUI();
                playFromCurrentPosition();
            } else if (!playing && currentSongName && songs[currentSongName]) {
                // Restart from beginning
                currentNoteIndex = 0;
                currentSong = songs[currentSongName];
                paused = false;
                playing = true;
                updatePlaybackUI();
                playFromCurrentPosition();
            }
        }

        function updatePlaybackUI() {
            document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('playing'));
            const nowPlaying = document.getElementById('nowPlaying');

            if (playing) {
                const btn = document.querySelector(`[onclick="playSong('${currentSongName}')"]`);
                if (btn) btn.classList.add('playing');
                const songNames = {
                    twinkle: 'Twinkle Twinkle',
                    smoke: 'Smoke on the Water',
                    scale: 'C Major Scale',
                    dontlookback: "Don't Look Back in Anger",
                    sweetchild: "Sweet Child O' Mine",
                    ifeelfine: "I Feel Fine",
                    sevennation: "Seven Nation Army",
                    sunshine: "Sunshine of Your Love",
                    comeasure: "Come As You Are",
                    billiejean: "Billie Jean",
                    beatit: "Beat It",
                    hanginaround: "Hanginaround",
                    andyourbird: "And Your Bird Can Sing",
                    ifineeded: "If I Needed Someone",
                    daytripper: "Day Tripper",
                    paperbackwriter: "Paperback Writer",
                    imported: 'Imported Tab'
                };
                nowPlaying.textContent = '♪ ' + (songNames[currentSongName] || currentSongName);
            } else if (paused) {
                nowPlaying.textContent = '⏸ Paused';
            } else {
                nowPlaying.textContent = '';
            }
        }

        function importTab() {
            const tabText = document.getElementById('tabInput').value;
            if (!tabText.trim()) return;

            const stringMapTab = {'e': 0, 'B': 1, 'G': 2, 'D': 3, 'A': 4, 'E': 5};
            const openStrings = {0: 64, 1: 59, 2: 55, 3: 50, 4: 45, 5: 40};

            // Parse all sections
            const sections = tabText.split(/\n\s*\n/);
            const allNotes = [];

            for (const section of sections) {
                const lines = section.trim().split('\n');
                const parsed = {};

                for (const line of lines) {
                    if (!line.includes('|')) continue;
                    const stringName = line.trim()[0];
                    if (!(stringName in stringMapTab)) continue;
                    const stringIdx = stringMapTab[stringName];
                    const parts = line.split('|');
                    if (parts.length >= 2) {
                        parsed[stringIdx] = parts[1];
                    }
                }

                if (Object.keys(parsed).length === 0) continue;
                const maxLen = Math.max(...Object.values(parsed).map(v => v.length));

                let col = 0;
                while (col < maxLen) {
                    const colNotes = [];

                    for (let stringIdx = 0; stringIdx < 6; stringIdx++) {
                        const content = parsed[stringIdx] || '';
                        if (col >= content.length) continue;

                        const char = content[col];
                        // Skip non-digit characters and technique markers
                        if (!/\d/.test(char)) {
                            continue;
                        }

                        // Check if previous char was a technique marker (this digit is part of like "h10")
                        if (col > 0 && /[hbp\/\\]/.test(content[col-1])) {
                            // This is part of a hammer-on target, still a valid note
                        }

                        // Read full fret number
                        let fretStr = char;
                        if (col + 1 < content.length && /\d/.test(content[col + 1])) {
                            fretStr += content[col + 1];
                        }
                        const fret = parseInt(fretStr);
                        const midi = openStrings[stringIdx] + fret;

                        colNotes.push({
                            string: stringIdx,
                            fret: fret,
                            midi: midi
                        });
                    }

                    if (colNotes.length > 0) {
                        // Take highest note (lowest string index)
                        colNotes.sort((a, b) => a.string - b.string);
                        allNotes.push(colNotes[0]);
                    }
                    col++;
                }
            }

            if (allNotes.length === 0) {
                alert('No notes found in tab');
                return;
            }

            // Convert to song format
            const importedSong = allNotes.map(n => [n.string, n.fret, n.midi, 200]);
            songs.imported = importedSong;

            // Add button if not exists
            if (!document.querySelector('[onclick="playSong(\'imported\')"]')) {
                const btn = document.createElement('button');
                btn.className = 'song-btn';
                btn.onclick = () => playSong('imported');
                btn.innerHTML = '<div class="song-title">Imported Tab</div><div class="song-info">' + allNotes.length + ' notes</div>';
                btn.setAttribute('onclick', "playSong('imported')");
                document.querySelector('.song-list').appendChild(btn);
            } else {
                document.querySelector('[onclick="playSong(\'imported\')"] .song-info').textContent = allNotes.length + ' notes';
            }

            alert('Imported ' + allNotes.length + ' notes!');
        }

        function playImported() {
            if (!songs.imported) {
                alert('Import a tab first');
                return;
            }
            playSong('imported');
        }

        function stopPlaying() {
            resetShowAll();
            playing = false;
            paused = false;
            clearTimeout(currentTimeout);
            currentNoteIndex = 0;
            hideAll();
            hideMainScrubber();
            updatePlaybackUI();
        }

        buildFretboard();

        // Preselect a scale from ?scale= (e.g. deep-linked from the Songs by Key page)
        (function () {
            const p = new URLSearchParams(location.search).get('scale');
            if (!p) return;
            const sel = document.getElementById('scaleSelect');
            if (sel) { sel.value = p; if (sel.value === p) showScale(p); }
        })();
    </script>
</body>
</html>
