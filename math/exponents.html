<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exponents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }

        header {
            text-align: center;
            padding: 15px 20px 10px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #EF4444, #DC2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .problem {
            text-align: center;
            font-size: 2.5rem;
            font-family: 'Georgia', serif;
            margin-bottom: 10px;
        }

        .problem sup {
            font-size: 1.5rem;
            color: #EF4444;
        }

        .breakdown-text {
            text-align: center;
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 30px;
            font-family: 'Georgia', serif;
        }

        .breakdown-text .times {
            color: #666;
            margin: 0 5px;
        }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 20px;
            background: #111;
            border-radius: 10px;
        }

        .step-label {
            min-width: 80px;
            font-family: 'Georgia', serif;
            font-size: 1.1rem;
            color: #888;
        }

        .step-label sup {
            color: #EF4444;
        }

        .step-blocks {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            flex: 1;
        }

        .block {
            width: 20px;
            height: 20px;
            background: #EF4444;
            border-radius: 3px;
        }

        .step-equals {
            color: #666;
            font-size: 1.2rem;
        }

        .step-value {
            min-width: 60px;
            text-align: right;
            font-size: 1.3rem;
            font-weight: 600;
            color: #22C55E;
        }

        .final-section {
            margin-top: 20px;
            padding: 25px;
            background: #0d1f0d;
            border-radius: 12px;
            border: 2px solid #22C55E33;
            text-align: center;
        }

        .final-answer {
            font-size: 3rem;
            color: #22C55E;
            font-weight: 700;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .control-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-buttons {
            display: flex;
            gap: 5px;
        }

        .num-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #333;
            background: #1a1a1f;
            color: #888;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        .num-btn:hover {
            border-color: #555;
            color: #fff;
        }

        .num-btn.selected {
            border-color: #EF4444;
            background: #EF444422;
            color: #EF4444;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>

    <header>
        <h1>Exponents</h1>
        <p class="subtitle">Repeated multiplication, step by step</p>
    </header>

    <main>
        <div class="controls">
            <div class="control-group">
                <span class="control-label">Base</span>
                <div class="control-buttons" id="baseButtons"></div>
            </div>
            <div class="control-group">
                <span class="control-label">Exponent</span>
                <div class="control-buttons" id="expButtons"></div>
            </div>
        </div>

        <div class="problem" id="problem"></div>
        <div class="breakdown-text" id="breakdown"></div>

        <div class="steps-container" id="steps"></div>

        <div class="final-section">
            <div class="final-answer" id="answer"></div>
        </div>
    </main>

    <script>
        let base = 2;
        let exp = 5;

        const baseButtons = document.getElementById('baseButtons');
        const expButtons = document.getElementById('expButtons');
        const problem = document.getElementById('problem');
        const breakdown = document.getElementById('breakdown');
        const steps = document.getElementById('steps');
        const answer = document.getElementById('answer');

        // Build buttons
        for (let i = 2; i <= 5; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn' + (i === base ? ' selected' : '');
            btn.textContent = i;
            btn.onclick = () => { base = i; render(); };
            baseButtons.appendChild(btn);
        }

        for (let i = 1; i <= 6; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn' + (i === exp ? ' selected' : '');
            btn.textContent = i;
            btn.onclick = () => { exp = i; render(); };
            expButtons.appendChild(btn);
        }

        function render() {
            // Update button states
            baseButtons.querySelectorAll('.num-btn').forEach((btn, i) => {
                btn.className = 'num-btn' + (i + 2 === base ? ' selected' : '');
            });
            expButtons.querySelectorAll('.num-btn').forEach((btn, i) => {
                btn.className = 'num-btn' + (i + 1 === exp ? ' selected' : '');
            });

            // Problem
            problem.innerHTML = `${base}<sup>${exp}</sup>`;

            // Breakdown text
            const timesArray = [];
            for (let i = 0; i < exp; i++) {
                timesArray.push(base);
            }
            breakdown.innerHTML = timesArray.join(' <span class="times">×</span> ');

            // Steps
            let stepsHTML = '';
            let current = 1;

            for (let i = 1; i <= exp; i++) {
                current *= base;

                // Create blocks for current value
                let blocksHTML = '';
                const numBlocks = Math.min(current, 200); // Cap for display
                for (let b = 0; b < numBlocks; b++) {
                    blocksHTML += '<div class="block"></div>';
                }
                if (current > 200) {
                    blocksHTML += `<span style="color:#666; margin-left:10px;">...${current - 200} more</span>`;
                }

                stepsHTML += `
                    <div class="step">
                        <div class="step-label">${base}<sup>${i}</sup></div>
                        <div class="step-blocks">${blocksHTML}</div>
                        <div class="step-equals">=</div>
                        <div class="step-value">${current}</div>
                    </div>
                `;
            }

            steps.innerHTML = stepsHTML;

            // Final answer
            answer.textContent = Math.pow(base, exp);
        }

        render();
    </script>
</body>
</html>
