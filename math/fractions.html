<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }

        header {
            text-align: center;
            padding: 15px 20px 10px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #F59E0B, #D97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .control-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-buttons {
            display: flex;
            gap: 5px;
        }

        .num-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #333;
            background: #1a1a1f;
            color: #888;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        .num-btn:hover {
            border-color: #555;
            color: #fff;
        }

        .num-btn.selected-num {
            border-color: #22C55E;
            background: #22C55E22;
            color: #22C55E;
        }

        .num-btn.selected-den {
            border-color: #3B82F6;
            background: #3B82F622;
            color: #3B82F6;
        }

        .fraction-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: 2.5rem;
            font-family: 'Georgia', serif;
        }

        .numerator {
            color: #22C55E;
            padding-bottom: 5px;
        }

        .fraction-line {
            width: 60px;
            height: 3px;
            background: #666;
        }

        .denominator {
            color: #3B82F6;
            padding-top: 5px;
        }

        .meanings {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .meaning-box {
            background: #111;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            min-width: 200px;
        }

        .meaning-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .meaning-value {
            font-size: 1.3rem;
            color: #888;
            font-family: 'Georgia', serif;
        }

        .meaning-value .hl {
            color: #e0e0e0;
        }

        .visual-section {
            background: #111;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .visual-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
        }

        .pie-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .bar-container {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .bar-piece {
            width: 50px;
            height: 80px;
            border-radius: 6px;
            border: 2px solid #333;
            background: #1a1a1f;
        }

        .bar-piece.filled {
            background: #22C55E;
            border-color: #22C55E;
        }

        .result-section {
            background: #0d1f0d;
            border-radius: 12px;
            border: 2px solid #22C55E33;
            padding: 25px;
            text-align: center;
        }

        .result-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 2.5rem;
            color: #22C55E;
            font-weight: 700;
        }

        .result-explain {
            font-size: 1rem;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>

    <header>
        <h1>Fractions</h1>
        <p class="subtitle">Parts of a whole. Division. Same thing.</p>
    </header>

    <main>
        <div class="controls">
            <div class="control-group">
                <span class="control-label">Numerator (parts you have)</span>
                <div class="control-buttons" id="numButtons"></div>
            </div>
            <div class="control-group">
                <span class="control-label">Denominator (total parts)</span>
                <div class="control-buttons" id="denButtons"></div>
            </div>
        </div>

        <div class="fraction-display">
            <div class="fraction">
                <div class="numerator" id="numDisplay">3</div>
                <div class="fraction-line"></div>
                <div class="denominator" id="denDisplay">4</div>
            </div>
        </div>

        <div class="meanings">
            <div class="meaning-box">
                <div class="meaning-label">Read as</div>
                <div class="meaning-value" id="readAs">3 out of 4</div>
            </div>
            <div class="meaning-box">
                <div class="meaning-label">Same as</div>
                <div class="meaning-value" id="sameAs">3 ÷ 4</div>
            </div>
            <div class="meaning-box">
                <div class="meaning-label">Equals</div>
                <div class="meaning-value" id="equals">0.75</div>
            </div>
        </div>

        <div class="visual-section">
            <div class="visual-label">See it</div>
            <div class="bar-container" id="barContainer"></div>
        </div>

        <div class="result-section">
            <div class="result-label">The fraction</div>
            <div class="result-value" id="resultValue">75%</div>
            <div class="result-explain" id="resultExplain">You have 3 of the 4 pieces</div>
        </div>
    </main>

    <script>
        let numerator = 3;
        let denominator = 4;

        const numButtons = document.getElementById('numButtons');
        const denButtons = document.getElementById('denButtons');

        // Build buttons
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn' + (i === numerator ? ' selected-num' : '');
            btn.textContent = i;
            btn.onclick = () => { numerator = i; render(); };
            numButtons.appendChild(btn);
        }

        for (let i = 2; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn' + (i === denominator ? ' selected-den' : '');
            btn.textContent = i;
            btn.onclick = () => { denominator = i; render(); };
            denButtons.appendChild(btn);
        }

        function render() {
            // Update button states
            numButtons.querySelectorAll('.num-btn').forEach((btn, i) => {
                btn.className = 'num-btn' + (i + 1 === numerator ? ' selected-num' : '');
            });
            denButtons.querySelectorAll('.num-btn').forEach((btn, i) => {
                btn.className = 'num-btn' + (i + 2 === denominator ? ' selected-den' : '');
            });

            // Fraction display
            document.getElementById('numDisplay').textContent = numerator;
            document.getElementById('denDisplay').textContent = denominator;

            // Meanings
            document.getElementById('readAs').innerHTML = `<span class="hl">${numerator}</span> out of <span class="hl">${denominator}</span>`;
            document.getElementById('sameAs').innerHTML = `${numerator} ÷ ${denominator}`;

            const decimal = numerator / denominator;
            document.getElementById('equals').textContent = decimal.toFixed(decimal === Math.floor(decimal) ? 0 : 2);

            // Bar visualization
            let barHTML = '';
            for (let i = 0; i < denominator; i++) {
                const filled = i < numerator;
                barHTML += `<div class="bar-piece ${filled ? 'filled' : ''}"></div>`;
            }
            document.getElementById('barContainer').innerHTML = barHTML;

            // Result
            const percent = (numerator / denominator * 100);
            document.getElementById('resultValue').textContent = percent.toFixed(percent === Math.floor(percent) ? 0 : 1) + '%';

            if (numerator < denominator) {
                document.getElementById('resultExplain').textContent = `You have ${numerator} of the ${denominator} pieces`;
            } else if (numerator === denominator) {
                document.getElementById('resultExplain').textContent = `You have all ${denominator} pieces = 1 whole`;
            } else {
                const wholes = Math.floor(numerator / denominator);
                const remainder = numerator % denominator;
                document.getElementById('resultExplain').textContent = `More than a whole! ${wholes} complete + ${remainder}/${denominator}`;
            }
        }

        render();
    </script>
</body>
</html>
