<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Blocks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }

        .back-link:hover {
            color: #fff;
        }

        header {
            text-align: center;
            padding: 15px 20px 10px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #A855F7, #7C3AED);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .problem {
            text-align: center;
            font-size: 2rem;
            font-family: 'Georgia', serif;
            margin-bottom: 30px;
        }

        .problem .op { color: #666; margin: 0 10px; }
        .problem .result { color: #22C55E; font-weight: 600; }

        .step {
            background: #111;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .step-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
        }

        .step-content {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .block-pile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .blocks-linear {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            max-width: 400px;
            padding: 10px;
            background: #1a1a1f;
            border-radius: 8px;
            justify-content: flex-start;
        }

        .block {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            background: #A855F7;
        }

        .groups-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .group-blocks {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 8px;
            background: #1a1a1f;
            border-radius: 6px;
            border: 2px solid #22C55E44;
            max-width: 100px;
        }

        .group-blocks .block {
            width: 14px;
            height: 14px;
            background: #22C55E;
        }

        .group-label {
            font-size: 0.8rem;
            color: #888;
        }

        .count-label {
            font-size: 1.2rem;
            color: #22C55E;
            font-weight: 600;
        }

        .equation-box {
            background: #1a1a24;
            border-radius: 8px;
            padding: 15px 25px;
            text-align: center;
            font-family: 'Georgia', serif;
            font-size: 1.2rem;
            color: #888;
        }

        .equation-box .highlight {
            color: #22C55E;
            font-weight: 600;
        }

        .sum-section {
            text-align: center;
            padding: 20px;
            background: #0d1f0d;
            border-radius: 12px;
            border: 2px solid #22C55E33;
        }

        .sum-equation {
            font-size: 1.2rem;
            font-family: 'Georgia', serif;
            color: #888;
            margin-bottom: 10px;
        }

        .final-answer {
            font-size: 3rem;
            color: #22C55E;
            font-weight: 700;
        }

        .answer-explain {
            font-size: 1rem;
            color: #888;
            margin-top: 10px;
        }

        .btn {
            display: block;
            margin: 20px auto;
            padding: 14px 32px;
            font-size: 1rem;
            border: 2px solid #3B82F6;
            background: #3B82F622;
            color: #3B82F6;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
            background: #3B82F633;
        }

        .score-display {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: center;
        }

        .score-label {
            font-size: 0.6rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 1.5rem;
            color: #A855F7;
            font-weight: 600;
        }

        .arrow {
            font-size: 2rem;
            color: #444;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>

    <div class="score-display">
        <div class="score-label">Solved</div>
        <div class="score-value" id="score">0</div>
    </div>

    <header>
        <h1>Division Blocks</h1>
        <p class="subtitle">How many groups of this size can I make?</p>
    </header>

    <main id="main"></main>

    <script>
        let total, divisor, quotient;
        let score = 0;
        const main = document.getElementById('main');

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function newProblem() {
            // Generate clean division problems
            divisor = randomInt(2, 9);
            quotient = randomInt(3, 12);
            total = divisor * quotient;
            render();
        }

        function renderBlocks(count) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += '<div class="block"></div>';
            }
            return html;
        }

        function render() {
            let html = '';

            // Problem
            html += `<div class="problem">${total} <span class="op">÷</span> ${divisor} <span class="op">=</span> <span class="result">?</span></div>`;

            // Step 1: Show all the blocks
            html += `
                <div class="step">
                    <div class="step-label">Start with ${total} blocks</div>
                    <div class="step-content">
                        <div class="blocks-linear">
                            ${renderBlocks(total)}
                        </div>
                    </div>
                </div>
            `;

            // Step 2: The question
            html += `
                <div class="step">
                    <div class="step-label">The question</div>
                    <div class="step-content">
                        <div class="equation-box">
                            How many groups of <span class="highlight">${divisor}</span> can I make?
                        </div>
                    </div>
                </div>
            `;

            // Step 3: Show them grouped
            html += `
                <div class="step">
                    <div class="step-label">Make groups of ${divisor}</div>
                    <div class="step-content">
                        <div class="groups-container">
            `;

            for (let i = 0; i < quotient; i++) {
                html += `
                    <div class="group">
                        <div class="group-blocks">
                            ${renderBlocks(divisor)}
                        </div>
                        <div class="group-label">${divisor}</div>
                    </div>
                `;
            }

            html += `
                        </div>
                    </div>
                </div>
            `;

            // Step 4: Count the groups
            html += `
                <div class="sum-section">
                    <div class="sum-equation">${total} blocks ÷ ${divisor} per group =</div>
                    <div class="final-answer">${quotient} groups</div>
                    <div class="answer-explain">${quotient} × ${divisor} = ${total} ← Division is just multiplication backwards</div>
                </div>
            `;

            html += `<button class="btn" onclick="next()">Next Problem</button>`;

            main.innerHTML = html;
        }

        function next() {
            score++;
            document.getElementById('score').textContent = score;
            newProblem();
        }

        newProblem();
    </script>
</body>
</html>
