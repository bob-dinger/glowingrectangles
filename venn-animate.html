<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venn — in motion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0d0d10;color:#e9e7e4;height:100vh;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
  }

  header{padding:28px 0 0;text-align:center}
  header h1{font-size:21px;font-weight:600;letter-spacing:-.01em}
  header p{font-size:13px;color:#75737f;margin-top:3px}

  #stage{flex:1;width:100%;max-width:880px;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%}

  .set{fill-opacity:.42;stroke-width:1.6}
  .a{fill:#38bdf8;stroke:#7dd3fc}
  .b{fill:#f472b6;stroke:#f9a8d4}

  .lbl{font-size:14px;font-weight:600;fill:#e9e7e4;text-anchor:middle}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  .readout{
    text-align:center;font-size:13px;color:#8b8996;height:22px;
  }
  .readout b{color:#5eead4;font-weight:600}

  .bar{display:flex;gap:8px;align-items:center;padding:16px 0 30px}
  .bar button{
    background:#17171d;border:1px solid #2c2c37;color:#c9c7d1;
    font:inherit;font-size:12px;padding:8px 15px;border-radius:6px;cursor:pointer;
  }
  .bar button:hover{border-color:#5eead4;color:#fff}
  .bar button.on{background:#5eead4;border-color:#5eead4;color:#062e29;font-weight:600}
  .bar label{display:flex;align-items:center;gap:8px;font-size:12px;color:#75737f;margin-left:10px}
  .bar input{accent-color:#5eead4;width:130px}
  .bar .v{color:#5eead4;min-width:34px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>Two sets, in motion</h1>
  <p>One GSAP timeline, yoyoing between apart and overlapping</p>
</header>

<div id="stage">
  <svg viewBox="0 0 700 340">
    <circle class="set a" id="ca" cx="250" cy="170" r="105"/>
    <circle class="set b" id="cb" cx="450" cy="170" r="105"/>
    <text class="lbl" id="la" x="250" y="46">A</text>
    <text class="lbl" id="lb" x="450" y="46">B</text>
  </svg>
</div>

<div class="readout" id="out">&nbsp;</div>

<div class="bar">
  <button id="play" class="on">Pause</button>
  <button id="apart">Apart</button>
  <button id="over">Overlap</button>
  <button id="full">Contained</button>
  <label>speed <input type="range" id="sp" min="0.25" max="3" step="0.05" value="1">
    <span class="v" id="spv">1.0×</span></label>
</div>

<script>
const ca=document.getElementById('ca'), cb=document.getElementById('cb');
const la=document.getElementById('la'), lb=document.getElementById('lb');
const out=document.getElementById('out');
const R=105, MID=350;

// three named distances between centres
const APART = 240;   // fully separate
const OVER  = 120;   // classic venn
const FULL  = 18;    // almost concentric

// lens area of two equal circles at centre distance d
function lens(d){
  if(d>=2*R) return 0;
  if(d<=0) return Math.PI*R*R;
  const a=Math.acos(d/(2*R));
  return 2*R*R*a - d*Math.sqrt(4*R*R-d*d)/2;
}
const FULLAREA = Math.PI*R*R;

// GSAP tweens this one object; everything else is derived from it
const s = {d: APART};

function apply(){
  const half = s.d/2;
  ca.setAttribute('cx', MID-half);
  cb.setAttribute('cx', MID+half);
  la.setAttribute('x', MID-half);
  lb.setAttribute('x', MID+half);
  const pct = lens(s.d)/FULLAREA*100;
  out.innerHTML = 'centres <b>'+s.d.toFixed(0)+'px</b> apart · overlap = <b>'
                + pct.toFixed(1)+'%</b> of one circle';
}
gsap.ticker.add(apply);

// the loop: apart → overlap → apart, forever
const tl = gsap.timeline({repeat:-1, yoyo:true, defaults:{ease:'power2.inOut'}});
tl.to(s, {d: OVER, duration: 1.6})
  .to(s, {d: FULL, duration: 1.2}, '+=0.35')
  .to(s, {d: OVER, duration: 1.2}, '+=0.35');

const playBtn=document.getElementById('play');
playBtn.onclick=()=>{
  if(tl.paused()){ tl.play(); playBtn.textContent='Pause'; playBtn.classList.add('on'); }
  else { tl.pause(); playBtn.textContent='Play'; playBtn.classList.remove('on'); }
};

// jump to a state — pauses the loop and tweens there
function goto(d){
  tl.pause(); playBtn.textContent='Play'; playBtn.classList.remove('on');
  gsap.to(s, {d, duration:0.9, ease:'power3.out', overwrite:true});
}
document.getElementById('apart').onclick=()=>goto(APART);
document.getElementById('over').onclick =()=>goto(OVER);
document.getElementById('full').onclick =()=>goto(FULL);

const sp=document.getElementById('sp'), spv=document.getElementById('spv');
sp.oninput=()=>{ tl.timeScale(+sp.value); spv.textContent=(+sp.value).toFixed(2)+'×'; };
</script>
</body>
</html>
