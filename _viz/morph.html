<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morph — three.js × d3 × gsap × svg</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#08080b}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e9e7e4}
  #gl{position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none}
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;
       padding:20px;pointer-events:auto}
  .bar button{
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#cfcdd6;
    font:inherit;font-size:12px;padding:8px 15px;border-radius:6px;cursor:pointer;
    backdrop-filter:blur(6px);transition:.18s;
  }
  .bar button:hover{border-color:#5eead4;color:#fff}
  .bar button.on{background:#5eead4;border-color:#5eead4;color:#062e29;font-weight:600}
</style>
</head>
<body>

<canvas id="gl"></canvas>

<!-- SVG overlay: labels + the readout ring -->
<svg id="ui">
  <g id="ring" opacity="0.9"></g>
  <text id="title" x="46" y="60" font-size="27" font-weight="600" fill="#fff">Sphere</text>
  <text id="sub"   x="46" y="82" font-size="12.5" fill="#7d7b88" class="t">8,000 points · one buffer, four shapes</text>
  <text id="count" x="46" y="112" font-size="11" fill="#5eead4" class="t"></text>
</svg>

<div class="bar">
  <button data-i="0" class="on">Sphere</button>
  <button data-i="1">Grid</button>
  <button data-i="2">Texas</button>
  <button data-i="3">Wave</button>
  <button id="loop">▶ Loop</button>
</div>

<script>
const N = 8000;
const NAMES = ['Sphere','Grid','Texas','Wave'];
const SUBS = [
  'parametric — spherical coordinates, evenly distributed',
  'd3.scaleLinear across a 2-D lattice',
  'sampled from a d3.geoPath rendered offscreen',
  'a travelling sine, amplitude by radius'
];

/* ==========================================================
   D3 builds every target shape. Three.js only draws them.
   ========================================================== */
const shapes = [];           // each: Float32Array(N*3)
const colors = [];           // each: Float32Array(N*3)

const cScale = d3.scaleSequential(d3.interpolateTurbo);

// ---------- 0 · sphere (fibonacci, so points spread evenly) ----------
{
  const pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i=0;i<N;i++){
    const y = 1 - (i/(N-1))*2, r = Math.sqrt(1-y*y), th = phi*i;
    pos[i*3]   = Math.cos(th)*r*36;
    pos[i*3+1] = y*36;
    pos[i*3+2] = Math.sin(th)*r*36;
    const c = d3.color(cScale((y+1)/2));
    col[i*3]=c.r/255; col[i*3+1]=c.g/255; col[i*3+2]=c.b/255;
  }
  shapes[0]=pos; colors[0]=col;
}

// ---------- 1 · grid ----------
{
  const pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const side = Math.ceil(Math.sqrt(N));
  const x = d3.scaleLinear([0,side-1],[-52,52]);
  const y = d3.scaleLinear([0,side-1],[-34,34]);
  for (let i=0;i<N;i++){
    const cx = i%side, cy = Math.floor(i/side);
    pos[i*3]=x(cx); pos[i*3+1]=y(cy); pos[i*3+2]=0;
    const c = d3.color(cScale(cx/side));
    col[i*3]=c.r/255; col[i*3+1]=c.g/255; col[i*3+2]=c.b/255;
  }
  shapes[1]=pos; colors[1]=col;
}

// ---------- 3 · wave ----------
{
  const pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const side = Math.ceil(Math.sqrt(N));
  const x = d3.scaleLinear([0,side-1],[-54,54]);
  const z = d3.scaleLinear([0,side-1],[-36,36]);
  for (let i=0;i<N;i++){
    const cx = i%side, cz = Math.floor(i/side);
    const X = x(cx), Z = z(cz), r = Math.hypot(X,Z);
    const Y = Math.sin(r*0.22) * 14 * Math.exp(-r*0.018);
    pos[i*3]=X; pos[i*3+1]=Y; pos[i*3+2]=Z;
    const c = d3.color(cScale((Y+14)/28));
    col[i*3]=c.r/255; col[i*3+1]=c.g/255; col[i*3+2]=c.b/255;
  }
  shapes[3]=pos; colors[3]=col;
}

/* ==========================================================
   Texas: draw the geoPath to an offscreen canvas, then sample
   filled pixels. Way faster than 8,000 × geoContains tests.
   ========================================================== */
function buildTexas(geo){
  const w=520,h=440;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  const proj=d3.geoAlbers().rotate([99,0]).center([0,31.2]).parallels([27,35])
              .fitExtent([[8,8],[w-8,h-8]],geo);
  const path=d3.geoPath(proj,ctx);
  ctx.fillStyle='#fff'; ctx.beginPath(); path(geo); ctx.fill();

  const px=ctx.getImageData(0,0,w,h).data;
  const inside=[];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(px[(y*w+x)*4]>128) inside.push([x,y]);

  const pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const sx=d3.scaleLinear([0,w],[-56,56]), sy=d3.scaleLinear([0,h],[38,-38]);
  for(let i=0;i<N;i++){
    const [x,y]=inside[(Math.random()*inside.length)|0];
    pos[i*3]=sx(x+Math.random());
    pos[i*3+1]=sy(y+Math.random());
    pos[i*3+2]=(Math.random()-0.5)*2.5;
    const c=d3.color(cScale(1-y/h));
    col[i*3]=c.r/255; col[i*3+1]=c.g/255; col[i*3+2]=c.b/255;
  }
  shapes[2]=pos; colors[2]=col;
  document.getElementById('count').textContent =
    `${inside.length.toLocaleString()} filled pixels sampled`;
}

/* ==========================================================
   Three.js
   ========================================================== */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.1,1000);
camera.position.set(0,0,132);

const geom=new THREE.BufferGeometry();
const cur=new Float32Array(N*3), curCol=new Float32Array(N*3);
cur.set(shapes[0]); curCol.set(colors[0]);
geom.setAttribute('position',new THREE.BufferAttribute(cur,3));
geom.setAttribute('color',new THREE.BufferAttribute(curCol,3));

const points=new THREE.Points(geom,new THREE.PointsMaterial({
  size:0.62, vertexColors:true, transparent:true, opacity:0.95,
  sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending
}));
scene.add(points);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* ==========================================================
   GSAP drives the morph. It tweens ONE number; the render
   loop lerps 8,000 points against it. Tweening the number
   instead of the array is what keeps this at 60fps.
   ========================================================== */
const state={k:0, spin:0.0016};
let from=0, to=0;

function goTo(i){
  if(i===to) return;
  if(!shapes[i]) return;                    // texas not loaded yet
  from=to; to=i;
  document.querySelectorAll('.bar [data-i]')
    .forEach(b=>b.classList.toggle('on', +b.dataset.i===i));
  document.getElementById('title').textContent=NAMES[i];
  document.getElementById('sub').textContent=SUBS[i];

  gsap.fromTo(state,{k:0},{
    k:1, duration:1.5, ease:'power2.inOut',
    onComplete(){ from=to; }
  });
  // a little camera push on every change
  gsap.fromTo(camera.position,{z:112},{z:132,duration:1.5,ease:'power2.out'});
}

const A=shapes, C=colors;
function render(){
  requestAnimationFrame(render);
  const a=A[from], b=A[to], ca=C[from], cb=C[to], k=state.k;
  for(let i=0;i<N*3;i++){
    cur[i]    = a[i]  + (b[i]-a[i])*k;
    curCol[i] = ca[i] + (cb[i]-ca[i])*k;
  }
  geom.attributes.position.needsUpdate=true;
  geom.attributes.color.needsUpdate=true;
  points.rotation.y += state.spin;
  renderer.render(scene,camera);
  drawRing();
}

/* ---------- SVG overlay ring, redrawn each frame ---------- */
const ring=d3.select('#ring');
const arc=d3.arc().innerRadius(20).outerRadius(24).startAngle(0);
const ringPath=ring.append('path').attr('fill','#5eead4');
ring.append('circle').attr('r',24).attr('fill','none')
    .attr('stroke','rgba(255,255,255,.12)').attr('stroke-width',4);
function drawRing(){
  const x=innerWidth-64, y=innerHeight-64;
  ring.attr('transform',`translate(${x},${y})`);
  ringPath.attr('d',arc({endAngle: (from===to?1:state.k)*Math.PI*2}));
}

/* ---------- controls ---------- */
document.querySelectorAll('.bar [data-i]').forEach(b=>{
  b.onclick=()=>{ stopLoop(); goTo(+b.dataset.i); };
});
let loopTl=null;
function stopLoop(){ if(loopTl){loopTl.kill(); loopTl=null;
  document.getElementById('loop').classList.remove('on');} }
document.getElementById('loop').onclick=function(){
  if(loopTl){ stopLoop(); return; }
  this.classList.add('on');
  loopTl=gsap.timeline({repeat:-1});
  [1,2,3,0].forEach(i=> loopTl.call(()=>goTo(i)).to({},{duration:2.6}));
};

render();

// Texas loads async — the other three shapes work immediately
d3.json('data/texas-counties.geojson').then(buildTexas).catch(()=>{
  document.getElementById('count').textContent='texas-counties.geojson not found';
});
</script>
</body>
</html>
