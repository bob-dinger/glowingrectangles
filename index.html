<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowing Rectangles</title>
<meta name="description" content="Glowing Rectangles — a Substack by Bob Dinger.">
<style>
  :root {
    color-scheme: light dark;
    --bg:   #fbfaf7;
    --ink:  #14110c;
    --mute: #6b655a;
    --rule: #e2ded4;
    --link: #14110c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#100f0d; --ink:#f2efe8; --mute:#918b7e; --rule:#2b2823; --link:#f2efe8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 ui-serif, Georgia, "Times New Roman", serif;
    display: grid;
    place-items: center;
    padding: 2rem;
  }
  main { width: 100%; max-width: 30rem; }
  h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0 0 0.75rem;
  }
  p { margin: 0 0 2rem; color: var(--mute); }
  .go {
    display: inline-block;
    color: var(--link);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 2px;
    font-weight: 600;
  }
  .go:hover { opacity: 0.6; }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    font-size: 0.875rem;
    color: var(--mute);
  }
  footer a { color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--rule); }
  footer a:hover { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Glowing Rectangles</h1>
  <p>Ideas, drawn. Curves, distributions, and the shapes behind how people see things.</p>
  <a class="go" href="https://glowingrectangles.substack.com/">Read it on Substack&nbsp;→</a>
  <footer>
    Bob Dinger · <a href="https://twitter.com/bobdinger">@bobdinger</a>
  </footer>
</main>
</body>
</html>
