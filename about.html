<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About This Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            z-index: 100;
        }
        .back-link:hover { color: #333; }

        .container {
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        .headline {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .headline-text {
            font-size: 20px;
            line-height: 1.5;
            color: #fff;
            margin-bottom: 20px;
        }

        .headline-source {
            font-size: 13px;
            color: #666;
        }

        .headline-source a {
            color: #10b981;
            text-decoration: none;
        }

        .headline-source a:hover {
            text-decoration: underline;
        }

        .explanation {
            color: #888;
            font-size: 15px;
            line-height: 1.7;
        }

        .rectangles {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .rect {
            border-radius: 6px;
            animation: glow 2s ease-in-out infinite;
        }

        .rect.phone {
            width: 30px;
            height: 50px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
        }

        .rect.tablet {
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #22C55E, #10b981);
        }

        .rect.laptop {
            width: 70px;
            height: 45px;
            background: linear-gradient(135deg, #F59E0B, #EF4444);
        }

        @keyframes glow {
            0%, 100% { opacity: 0.7; box-shadow: 0 0 10px currentColor; }
            50% { opacity: 1; box-shadow: 0 0 20px currentColor; }
        }

        .rect.phone { animation-delay: 0s; }
        .rect.tablet { animation-delay: 0.3s; }
        .rect.laptop { animation-delay: 0.6s; }

        .article-card {
            display: flex;
            align-items: center;
            padding: 16px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .article-card:hover {
            border-color: #00ab00;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 171, 0, 0.15);
        }

        .article-card .card-logo {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 8px;
            object-fit: contain;
            background: #00ab00;
            padding: 12px;
        }

        .article-card .card-content {
            margin-left: 16px;
            text-align: left;
        }

        .article-card .card-source {
            font-size: 12px;
            color: #00ab00;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .article-card .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .article-card .card-description {
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>

    <div class="container">
        <a href="https://theonion.com/report-90-of-waking-hours-spent-staring-at-glowing-re-1819570829/" target="_blank" class="article-card">
            <img src="https://theonion.com/wp-content/uploads/2024/07/site-logo.svg" alt="The Onion" class="card-logo">
            <div class="card-content">
                <div class="card-source">The Onion</div>
                <div class="card-title">Report: 90% Of Waking Hours Spent Staring At Glowing Rectangles</div>
                <div class="card-description">theonion.com</div>
            </div>
        </a>
    </div>
</body>
</html>
