<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closer Than You Think</title>
<style>
  :root{--bg:#12100e;--panel:#1a1713;--ink:#efe9df;--mute:#8d8477;--rule:#2b2721;
        --dem:#5b8ce8;--rep:#e0605a;--lit:#f0b429}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  aside{flex:0 0 288px;background:var(--panel);border-right:1px solid var(--rule);
        padding:24px 0 16px;display:flex;flex-direction:column;overflow:hidden}
  aside h1{font-size:18px;font-weight:650;padding:0 20px;letter-spacing:-.01em}
  aside .sub{font-size:12px;color:var(--mute);padding:6px 20px 12px;line-height:1.5}
  .grouplabel{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
              padding:13px 20px 6px}
  .qlist{overflow-y:auto;flex:1}
  .q{padding:6px 20px;font-size:12.5px;cursor:pointer;border-left:2px solid transparent;
     color:#b5ad9f;line-height:1.35}
  .q:hover{background:#221e19;color:var(--ink)}
  .q.on{border-left-color:var(--accent,#fff);background:#221e19;color:var(--ink);font-weight:550}
  .q .n{font-size:10.5px;color:var(--mute);margin-left:5px}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:16px;padding:22px 30px}
  .ask{font-size:16.5px;text-align:center;line-height:1.45;color:#ddd5c8;max-width:680px}
  .ask b{color:var(--ink);font-weight:600}

  .panels{display:flex;gap:44px;align-items:flex-start}
  .pane{display:flex;flex-direction:column;align-items:center;gap:9px}
  .pane .cap{font-size:12px;color:var(--mute);letter-spacing:.02em}
  .pane .cap b{font-weight:600}
  .pane .tally{font-size:27px;font-weight:600;line-height:1}
  canvas{image-rendering:pixelated}

  .verdict{font-size:14.5px;color:var(--mute);text-align:center;height:21px}
  .verdict b{color:var(--lit);font-weight:600}
  footer{position:fixed;bottom:12px;right:20px;font-size:10.5px;color:#57514a;
         text-align:right;line-height:1.5}
  .replay{background:none;border:1px solid var(--rule);color:var(--mute);padding:5px 13px;
          border-radius:5px;font-size:11.5px;cursor:pointer}
  .replay:hover{color:var(--ink);border-color:#3c362e}
</style>
</head>
<body>

<aside>
  <h1>Closer Than You Think</h1>
  <div class="sub">Each side was asked what the other side believes. Then the other side
    was asked directly.</div>
  <div class="qlist" id="qlist"></div>
</aside>

<main>
  <div class="ask" id="ask"></div>
  <div class="panels">
    <div class="pane">
      <div class="cap" id="capL"></div>
      <canvas id="cvL"></canvas>
      <div class="tally" id="tallyL" style="color:#8d8477">–</div>
    </div>
    <div class="pane">
      <div class="cap" id="capR"></div>
      <canvas id="cvR"></canvas>
      <div class="tally" id="tallyR">–</div>
    </div>
  </div>
  <div class="verdict" id="verdict"></div>
  <button class="replay" id="replay">Again</button>
</main>

<footer>
  More in Common, &ldquo;The Perception Gap&rdquo; (Yudkin, Hawkins &amp; Dixon)<br>
  YouGov, Nov 7&ndash;10 2018 &middot; n = 2,100 US adults &middot; MoE &plusmn;2.1%
</footer>

<script>
/* ===================================================================
   The villagers, lifted from villagers.html so the two finally meet:
   that page made them walk, sprite_cards.py made them count. Here they
   do both. Pixel art stays pixel art -- drawn at 1x, blown up with
   nearest neighbour so every pixel stays square.
   =================================================================== */
const BODY = [
  '....HHHH....','...HHHHHHh..','..HHHHHHHHh.','..HSSSSSSh..',
  '..HSESSESh..','..HSSSSSSh..','...SSSSSs...','....NNNs....',
  '..TTTTTTtt..','.STTTTTTTtS.','.STTTTTTTtS.','.sTTTTTTTts.',
  '..TTTTTTtt..',
];
const BODY_LONGHAIR = [
  '....HHHH....','...HHHHHHh..','..HHHHHHHHh.','..HSSSSSSHh.',
  '..HSESSESHh.','..HSSSSSSHh.','..HHSSSSHHh.','....NNNs....',
  '..TTTTTTtt..','.STTTTTTTtS.','.STTTTTTTtS.','.sTTTTTTTts.',
  '..TTTTTTtt..',
];
const BODY_HAT = [
  '...KKKKKK...','..KKKKKKKK..','.KKKKKKKKKK.','..HSSSSSSh..',
  '..HSESSESh..','..HSSSSSSh..','...SSSSSs...','....NNNs....',
  '..TTTTTTtt..','.STTTTTTTtS.','.STTTTTTTtS.','.sTTTTTTTts.',
  '..TTTTTTtt..',
];
const BODIES = [BODY, BODY_LONGHAIR, BODY_HAT];
const LEGS = { stand: ['..LLL..LLl..','..LLL..LLl..','..BBB..BBb..'] };
const SKINS =[[240,195,145],[226,171,120],[198,140,95],[163,110,72],[126,82,52],[247,214,178]];
const HAIRS =[[74,47,22],[38,28,20],[122,80,36],[168,128,64],[96,96,102],[140,52,38]];
const HATS  =[[122,82,38],[92,62,112],[58,102,72],[150,60,50]];
const LEGCOL=[[74,53,36],[58,60,74],[88,72,50]];
const shade=(c,f=.74)=>c.map(v=>Math.round(v*f));

/* A lit villager wears their side's colour; an unlit one is the same person
   in the dark. Same body, same hair -- only the light changes, so the extra
   people who light up are visibly the SAME hundred, not a new crowd. */
function palette(s,h,t,l,k,lit){
  const dim = c => c.map(v => Math.round(v*0.30 + 18*0.70));
  const f = lit ? (c=>c) : dim;
  return {H:f(HAIRS[h]), h:f(shade(HAIRS[h])),
          S:f(SKINS[s]), s:f(shade(SKINS[s],.86)), N:f(shade(SKINS[s],.88)),
          T:f(t), t:f(shade(t)),
          K:f(HATS[k]), k:f(shade(HATS[k])),
          L:f(LEGCOL[l]), l:f(shade(LEGCOL[l])),
          B:f([36,26,18]), b:f([21,15,10]),
          E:f([26,16,8]), O:lit?[23,16,10]:[16,13,11]};
}

const PX = 3, TW = 14, TH = 18;
const tileCache = new Map();
function tile(key, rows, pal, flip){
  const ck = key+'|'+flip;
  if (tileCache.has(ck)) return tileCache.get(ck);
  const c=document.createElement('canvas');
  c.width=TW*PX; c.height=TH*PX;
  const g=c.getContext('2d');
  const filled=new Map();
  rows.forEach((row,r)=>[...row].forEach((ch,cc)=>{ if(ch!=='.') filled.set((cc+1)+','+(r+1), ch); }));
  const put=(x,y,col)=>{ g.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`; g.fillRect(x*PX,y*PX,PX,PX); };
  for(const k of filled.keys()){                       // 1px outline first
    const [x,y]=k.split(',').map(Number);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const n=(x+dx)+','+(y+dy);
      if(!filled.has(n)&&x+dx>=0&&x+dx<TW&&y+dy>=0&&y+dy<TH) put(x+dx,y+dy,pal.O);
    });
  }
  for(const [k,ch] of filled){ const [x,y]=k.split(',').map(Number); if(pal[ch]) put(x,y,pal[ch]); }
  if(flip){
    const f=document.createElement('canvas'); f.width=c.width; f.height=c.height;
    const fg=f.getContext('2d'); fg.translate(c.width,0); fg.scale(-1,1); fg.drawImage(c,0,0);
    tileCache.set(ck,f); return f;
  }
  tileCache.set(ck,c); return c;
}

/* Deterministic per question, so a given question is always the same hundred
   people -- the crowd is a cast, not noise that reshuffles under you. */
function seeded(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%100000)/100000; };
}

const COLS=10, ROWS=10, CELL_W=TW*PX+3, CELL_H=TH*PX-4;

function buildCrowd(id, tunic){
  const r = seeded(id);
  return Array.from({length:100}, () => ({
    body: Math.floor(r()*BODIES.length),
    s: Math.floor(r()*SKINS.length), h: Math.floor(r()*HAIRS.length),
    l: Math.floor(r()*LEGCOL.length), k: Math.floor(r()*HATS.length),
    flip: r()<.5, phase: r()*Math.PI*2, tunic,
  }));
}

function drawPanel(cv, crowd, litCount, t){
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0,0,cv.width,cv.height);
  crowd.forEach((c,i) => {
    const lit = i < litCount;
    const key = `${c.body}-${c.s}-${c.h}-${c.l}-${c.k}-${lit}-${c.tunic.join(',')}`;
    const pal = palette(c.s, c.h, c.tunic, c.l, c.k, lit);
    const img = tile(key, BODIES[c.body].concat(LEGS.stand), pal, c.flip);
    // a slow weight-shift so the crowd breathes without marching
    const bob = lit ? Math.round(Math.sin(t/620 + c.phase)) : 0;
    g.drawImage(img, (i%COLS)*CELL_W, Math.floor(i/COLS)*CELL_H + bob);
  });
}

const ITEMS = [
  {id:'police',            by:'Republicans', of:'Democrats',   p:48, a:85, ask:'think <b>most police are not bad people</b>'},
  {id:'immigration',       by:'Democrats',   of:'Republicans', p:52, a:85, ask:'think <b>properly controlled immigration can be good</b> for the country'},
  {id:'proud',             by:'Republicans', of:'Democrats',   p:54, a:82, ask:'are <b>proud to be American</b>, while acknowledging the country&rsquo;s flaws'},
  {id:'racism',            by:'Democrats',   of:'Republicans', p:51, a:79, ask:'think <b>racism still exists</b> in America'},
  {id:'false-accusations', by:'Republicans', of:'Democrats',   p:45, a:74, ask:'think it matters that men are <b>protected from false accusations</b>'},
  {id:'open-borders',      by:'Republicans', of:'Democrats',   p:38, a:71, ask:'think the US should <b>not</b> have completely open borders'},
  {id:'muslims',           by:'Democrats',   of:'Republicans', p:41, a:70, ask:'think many Muslims are <b>good Americans</b>'},
  {id:'firearms',          by:'Republicans', of:'Democrats',   p:44, a:68, ask:'think law-abiding citizens <b>should have the right</b> to own firearms'},
  {id:'sexism',            by:'Democrats',   of:'Republicans', p:47, a:66, ask:'think <b>sexism still exists</b> in America'},
  {id:'guns',              by:'Democrats',   of:'Republicans', p:47, a:65, ask:'think government <b>should do more</b> to keep guns from dangerous people'},
  {id:'socialist',         by:'Republicans', of:'Democrats',   p:37, a:62, ask:'think America should <b>not</b> be a socialist country'},
  {id:'ice',               by:'Republicans', of:'Democrats',   p:40, a:53, ask:'think the US should <b>not</b> abolish ICE'},
  {id:'trump-flawed',      by:'Democrats',   of:'Republicans', p:47, a:48, ask:'think Donald Trump is a <b>flawed person</b>'},
  {id:'climate',           by:'Democrats',   of:'Republicans', p:44, a:46, ask:'think people are right to be <b>concerned about climate change</b>'},
  {id:'extreme-d',         by:'Republicans', of:'Democrats',   p:56, a:29, ask:'<b>hold views</b> most people would call extreme', flip:true},
  {id:'extreme-r',         by:'Democrats',   of:'Republicans', p:53, a:34, ask:'<b>hold views</b> most people would call extreme', flip:true},
];
const TUNIC = {Democrats:[70,116,196], Republicans:[186,66,58]};
const HEX   = {Democrats:'#5b8ce8',    Republicans:'#e0605a'};

const cvL=document.getElementById('cvL'), cvR=document.getElementById('cvR');
[cvL,cvR].forEach(c => { c.width = COLS*CELL_W; c.height = ROWS*CELL_H + 10; });

let current=ITEMS[0], crowd=[], shownRight=0, target=0, raf=null, startedAt=0;

function render(item){
  current = item;
  const col = HEX[item.of];
  document.documentElement.style.setProperty('--accent', col);
  document.getElementById('ask').innerHTML =
    `Out of every 100 <b style="color:${col}">${item.of}</b>, how many<br>${item.ask}?`;
  document.getElementById('capL').innerHTML =
    `what <b style="color:${HEX[item.by]}">${item.by}</b> picture`;
  document.getElementById('capR').innerHTML = `what is actually there`;
  document.getElementById('tallyL').textContent = item.p;
  document.getElementById('tallyR').style.color = col;
  document.getElementById('verdict').innerHTML = '&nbsp;';

  crowd = buildCrowd(item.id, TUNIC[item.of]);
  shownRight = item.p;          // the right panel starts where you guessed
  target = item.a;              // then the truth arrives, one person at a time
  startedAt = performance.now();

  if (raf) cancelAnimationFrame(raf);
  const loop = (t) => {
    const held = t - startedAt;
    if (held > 700 && shownRight !== target){
      const step = shownRight < target ? 1 : -1;
      if ((held - 700) / 26 > Math.abs(shownRight - item.p)) shownRight += step;
    }
    drawPanel(cvL, crowd, item.p, t);
    drawPanel(cvR, crowd, shownRight, t);
    document.getElementById('tallyR').textContent = shownRight;
    if (shownRight === target && !document.getElementById('verdict').dataset.done){
      const d = Math.abs(item.a - item.p);
      const v = document.getElementById('verdict');
      v.dataset.done = '1';
      v.innerHTML = item.flip
        ? `<b>${d} of them</b> were never there. ${item.by} imagined a crowd almost twice the size.`
        : `<b>${d} more of them</b> agree than ${item.by} imagine.`;
    }
    raf = requestAnimationFrame(loop);
  };
  document.getElementById('verdict').dataset.done = '';
  raf = requestAnimationFrame(loop);
}

const qlist=document.getElementById('qlist');
[['Republicans','What Republicans get wrong about Democrats'],
 ['Democrats','What Democrats get wrong about Republicans']].forEach(([by,label])=>{
  const h=document.createElement('div'); h.className='grouplabel'; h.textContent=label;
  qlist.appendChild(h);
  ITEMS.filter(i=>i.by===by).forEach(item=>{
    const d=document.createElement('div'); d.className='q';
    const text=item.ask.replace(/<\/?b>/g,'').replace(/^think /,'');
    d.innerHTML=text+`<span class="n mono">${item.p}&rarr;${item.a}</span>`;
    d.onclick=()=>{ document.querySelectorAll('.q').forEach(q=>q.classList.remove('on'));
                    d.classList.add('on'); render(item); };
    item._node=d; qlist.appendChild(d);
  });
});
document.getElementById('replay').onclick=()=>render(current);
ITEMS[0]._node.classList.add('on');
render(ITEMS[0]);
</script>
</body>
</html>
