<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Carlito', sans-serif;
            background-color: #fafafa;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        .app-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: white;
            border-bottom: 1px solid #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 12px;
        }

        .app-bar .title {
            background: #111827;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .app-bar a {
            color: #10b981;
            text-decoration: none;
            font-size: 14px;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 64px);
            margin-top: 64px;
        }

        .sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .group-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .group-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .group-item:hover {
            background: #f3f4f6;
        }

        .group-item.active {
            background: #ecfdf5;
            border-color: #10b981;
        }

        .group-item .name {
            font-weight: 600;
            font-size: 14px;
            color: #111827;
            margin-bottom: 4px;
        }

        .group-item .meta {
            font-size: 12px;
            color: #6b7280;
        }

        .chart-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
        }

        .chart-subtitle {
            font-size: 13px;
            color: #6b7280;
        }

        .year-buttons {
            display: flex;
            gap: 6px;
        }

        .year-btn {
            padding: 6px 12px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .year-btn:hover {
            border-color: #10b981;
        }

        .year-btn.active {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            height: 36px;
        }

        .bar-label {
            width: 180px;
            font-size: 13px;
            color: #374151;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 12px;
            text-align: right;
        }

        .bar-label.you {
            font-weight: 700;
            color: #10b981;
        }

        .bar-wrapper {
            flex: 1;
            height: 24px;
            background: #f3f4f6;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .bar-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        .bar-2024 { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .bar-2025 { background: linear-gradient(90deg, #10b981, #34d399); }
        .bar-2026 { background: linear-gradient(90deg, #3b82f6, #60a5fa); }

        .bar-single { background: linear-gradient(90deg, #10b981, #34d399); }
        .bar-you { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

        .bar-count {
            width: 80px;
            font-size: 13px;
            color: #6b7280;
            padding-left: 12px;
            display: flex;
            align-items: center;
        }

        .bar-percent {
            width: 50px;
            font-size: 12px;
            color: #9ca3af;
        }

        .legend {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .legend-color.y2024 { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .legend-color.y2025 { background: linear-gradient(90deg, #10b981, #34d399); }
        .legend-color.y2026 { background: linear-gradient(90deg, #3b82f6, #60a5fa); }

        .tooltip {
            position: fixed;
            background: #111827;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f3f4f6;
            padding: 12px 16px;
            border-radius: 8px;
        }

        .stat-box .value {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
        }

        .stat-box .label {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="app-bar">
        <a href="../index.html">Home</a>
        <a href="messages-viz.html">All Messages</a>
        <a href="messages-trends.html">Trends</a>

            <div class="stats-row" id="statsRow"></div>

        const tooltip = document.getElementById('tooltip');
        let currentGroup = null;
        let currentYear = 'all';

        function formatContact(contact) {
            if (contact === 'You') return 'You';
            if (contact.includes('@')) return contact.split('@')[0];
            return contact;
        }

        function getTotal(member, year) {
            if (year === 'all') {
                return (member.y2024 || 0) + (member.y2025 || 0) + (member.y2026 || 0);
            }
            return member['y' + year] || 0;
        }

        function renderGroupList() {
            const container = document.getElementById('groupList');
            const sortedGroups = Object.entries(groups)
                .map(([id, g]) => ({
                    id,
                    name: g.name,
                    total: g.members.reduce((sum, m) => sum + getTotal(m, 'all'), 0),
                    memberCount: g.members.length
                }))
                .sort((a, b) => b.total - a.total);

            container.innerHTML = sortedGroups.map(g => `
                <div class="group-item" data-id="${g.id}">
                    <div class="name">${g.name}</div>
                    <div class="meta">${g.memberCount} members · ${g.total.toLocaleString()} messages</div>
                </div>
            `).join('');

            container.querySelectorAll('.group-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.group-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    currentGroup = item.dataset.id;
                    renderChart();
                });
            });

            // Select first group by default
            if (sortedGroups.length > 0) {
                container.querySelector('.group-item').click();
            }
        }

        function renderChart() {
            if (!currentGroup) return;

            const group = groups[currentGroup];
            const members = group.members
                .map(m => ({...m, total: getTotal(m, currentYear)}))
                .filter(m => m.total > 0)
                .sort((a, b) => b.total - a.total);

            const totalMessages = members.reduce((sum, m) => sum + m.total, 0);
            const maxTotal = Math.max(...members.map(m => m.total));

            document.getElementById('chartTitle').textContent = group.name;
            document.getElementById('chartSubtitle').textContent =
                currentYear === 'all' ? 'All time (past 2 years)' : currentYear;

            // Stats
            const youData = members.find(m => m.id === 'You');
            const youPercent = youData ? ((youData.total / totalMessages) * 100).toFixed(1) : 0;
            document.getElementById('statsRow').innerHTML = `
                <div class="stat-box">
                    <div class="value">${totalMessages.toLocaleString()}</div>
                    <div class="label">Total Messages</div>
                </div>
                <div class="stat-box">
                    <div class="value">${members.length}</div>
                    <div class="label">Active Members</div>
                </div>
                <div class="stat-box">
                    <div class="value">${youPercent}%</div>
                    <div class="label">Your Share</div>
                </div>
            `;

            // Legend
            const legend = document.getElementById('legend');
            if (currentYear === 'all') {
                legend.innerHTML = `
                    <div class="legend-item"><div class="legend-color y2024"></div><span>2024</span></div>
                    <div class="legend-item"><div class="legend-color y2025"></div><span>2025</span></div>
                    <div class="legend-item"><div class="legend-color y2026"></div><span>2026</span></div>
                `;
            } else {
                legend.innerHTML = '';
            }

            // Bars
            const container = document.getElementById('chartArea');
            container.innerHTML = members.map(m => {
                const percent = ((m.total / totalMessages) * 100).toFixed(1);
                const isYou = m.id === 'You';
                let barsHtml = '';

                if (currentYear === 'all') {
                    barsHtml = `
                        <div class="bar-segment bar-2024" style="width: ${((m.y2024 || 0) / maxTotal) * 100}%"></div>
                        <div class="bar-segment bar-2025" style="width: ${((m.y2025 || 0) / maxTotal) * 100}%"></div>
                        <div class="bar-segment bar-2026" style="width: ${((m.y2026 || 0) / maxTotal) * 100}%"></div>
                    `;
                } else {
                    barsHtml = `<div class="bar-segment ${isYou ? 'bar-you' : 'bar-single'}" style="width: ${(m.total / maxTotal) * 100}%"></div>`;
                }

                return `
                    <div class="bar-row" data-id="${m.id}">
                        <div class="bar-label ${isYou ? 'you' : ''}" title="${m.id}">${formatContact(m.id)}</div>
                        <div class="bar-wrapper">${barsHtml}</div>
                        <div class="bar-count">${m.total.toLocaleString()}</div>
                        <div class="bar-percent">${percent}%</div>
                    </div>
                `;
            }).join('');

            // Tooltips
            container.querySelectorAll('.bar-row').forEach(row => {
                const member = members.find(m => m.id === row.dataset.id);
                row.addEventListener('mouseenter', () => {
                    let html = `<strong>${member.id}</strong><br>`;
                    if (currentYear === 'all') {
                        html += `2024: ${(member.y2024 || 0).toLocaleString()}<br>`;
                        html += `2025: ${(member.y2025 || 0).toLocaleString()}<br>`;
                        html += `2026: ${(member.y2026 || 0).toLocaleString()}`;
                    } else {
                        html += `Messages: ${member.total.toLocaleString()}`;
                    }
                    tooltip.innerHTML = html;
                    tooltip.style.opacity = 1;
                });
                row.addEventListener('mousemove', (e) => {
                    tooltip.style.left = e.clientX + 10 + 'px';
                    tooltip.style.top = e.clientY + 10 + 'px';
                });
                row.addEventListener('mouseleave', () => {
                    tooltip.style.opacity = 0;
                });
            });
        }

        // Year buttons
        document.querySelectorAll('.year-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentYear = btn.dataset.year;
                renderChart();
            });
        });

        // Initialize
        renderGroupList();
    </script>
</body>
