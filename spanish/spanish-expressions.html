<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Spanish Expressions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            z-index: 100;
        }
        .back-link:hover { color: #fff; }

        .title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .layout {
            display: flex;
            height: 100vh;
            padding-top: 60px;
        }

        .sidebar {
            width: 180px;
            background: #111;
            border-right: 1px solid #222;
            padding: 20px 0;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 16px;
            margin-bottom: 12px;
        }
        .emotion-list {
            list-style: none;
        }
        .emotion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .emotion-item:hover {
            background: #1a1a1a;
        }
        .emotion-item.active {
            background: #1a1a1a;
            border-left-color: var(--emotion-color, #F97316);
        }
        .emotion-icon {
            font-size: 18px;
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 30px 50px;
        }

        .emotion-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }
        .emotion-header .icon {
            font-size: 48px;
        }
        .emotion-header .text h1 {
            font-size: 32px;
            margin-bottom: 4px;
        }
        .emotion-header .text p {
            color: #666;
            font-size: 14px;
        }

        .expressions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .expression-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .expression-card:hover {
            border-color: var(--emotion-color, #F97316);
            transform: translateY(-2px);
        }
        .expression-card.expanded {
            border-color: var(--emotion-color, #F97316);
            background: #222;
        }
        .expression-spanish {
            font-size: 22px;
            font-weight: 600;
            color: var(--emotion-color, #F97316);
            margin-bottom: 6px;
        }
        .expression-english {
            font-size: 14px;
            color: #888;
            margin-bottom: 4px;
        }
        .expression-literal {
            font-size: 12px;
            color: #555;
            font-style: italic;
        }
        .expression-region {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .examples {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #333;
            display: none;
        }
        .expression-card.expanded .examples {
            display: block;
        }
        .example {
            margin-bottom: 12px;
        }
        .example:last-child {
            margin-bottom: 0;
        }
        .example-spanish {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 2px;
        }
        .example-english {
            font-size: 12px;
            color: #666;
        }
        .example-context {
            font-size: 11px;
            color: #555;
            margin-top: 2px;
            font-style: italic;
        }
    </style>
</head>

        const emotionList = document.getElementById('emotionList');
        const main = document.getElementById('main');

        // Build emotion list
        Object.entries(emotions).forEach(([key, emotion]) => {
            const li = document.createElement('li');
            li.className = 'emotion-item';
            li.style.setProperty('--emotion-color', emotion.color);
            li.innerHTML = `
                <span class="emotion-icon">${emotion.icon}</span>
                <span>${emotion.name}</span>
            `;
            li.addEventListener('click', () => selectEmotion(key));
            emotionList.appendChild(li);
        });

        function selectEmotion(key) {
            const emotion = emotions[key];
            document.documentElement.style.setProperty('--emotion-color', emotion.color);

            // Update sidebar
            document.querySelectorAll('.emotion-item').forEach((item, i) => {
                item.classList.toggle('active', Object.keys(emotions)[i] === key);
            });

            // Build main content
            let html = `
                <div class="emotion-header">
                    <div class="icon">${emotion.icon}</div>
                    <div class="text">
                        <h1>${emotion.name}</h1>
                        <p>${emotion.description}</p>
                    </div>
                </div>
                <div class="expressions-grid">
            `;

            emotion.expressions.forEach((expr, i) => {
                html += `
                    <div class="expression-card" onclick="toggleCard(this)">
                        <div class="expression-spanish">${expr.es}</div>
                        <div class="expression-english">${expr.en}</div>
                        <div class="expression-literal">${expr.literal}</div>
                        <span class="expression-region">${expr.region}</span>
                        <div class="examples">
                            ${expr.examples.map(ex => `
                                <div class="example">
                                    <div class="example-spanish">${ex.es}</div>
                                    <div class="example-english">${ex.en}</div>
                                    <div class="example-context">${ex.context}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            main.innerHTML = html;
        }

        function toggleCard(card) {
            card.classList.toggle('expanded');
        }

        // Select first emotion
        selectEmotion(Object.keys(emotions)[0]);
    </script>
