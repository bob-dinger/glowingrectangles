<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Colors — Glowing Gardens</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:#0f0f1f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
 header{padding:12px 16px;border-bottom:1px solid #2a2a4a;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
 header h1{font-size:16px;margin:0} a.back{color:#6a6a8a;text-decoration:none;font-size:13px} a.back:hover{color:#fff}
 label{font-size:13px;color:#8a8ab0;display:flex;align-items:center;gap:7px}
 select{background:#1a1a2e;color:#e0e0e0;border:1px solid #3a3a5a;border-radius:7px;padding:8px 10px;font-size:14px;cursor:pointer}
 .legend{margin-left:auto;display:flex;gap:8px;font-family:ui-monospace,monospace;font-size:11px;color:#8a8ab0;flex-wrap:wrap}
 .legend .lg{display:flex;align-items:center;gap:3px}.legend .sw{width:11px;height:11px;border-radius:3px}
 main{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:auto}
 .chord{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform .12s}
 .chord:hover{transform:translateY(-3px)}
 .chord .name{font-size:15px;font-weight:700;color:#e8e8f4}
 .chord .rn{font-size:12px;color:#8a8ab0;font-family:ui-monospace,monospace}
 .stack{display:flex;flex-direction:column-reverse;gap:3px}
 .tone{width:78px;height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1}
 .tone .n{font-size:16px}.tone .d{font-size:10px;font-weight:600;opacity:.8}
 @media(max-width:900px){.tone{width:60px;height:40px}}
</style></head><body>
<header>
 <a class="back" href="index.html">&larr; Music</a>
 <h1>Chord Colors</h1>
 <label>Key <select id="key"></select></label>
 <label>Type <select id="type"></select></label>
 <div class="legend" id="legend"></div>
</header>
<main id="chords"></main>
<script>
const LETTERS=['C','D','E','F','G','A','B'], LP={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const MAJ=[0,2,4,5,7,9,11];
const COL=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#a855f7','#ec4899'];       // deg 1..7
const TXT=['#fff','#1a1a2e','#1a1a2e','#1a1a2e','#fff','#fff','#fff'];
const KEYS=['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'];
// chord types: offsets in SCALE STEPS from the chord root
const TYPES={
 'Triad':[0,2,4], '6':[0,2,4,5], '7th':[0,2,4,6], 'sus2':[0,1,4], 'sus4':[0,3,4],
 'add9':[0,2,4,7], '9':[0,2,4,6,7], '11':[0,2,4,6,7,9], '13':[0,2,4,6,7,9,11]
};
const TRIQ=['','m','m','','','m','dim'];
const SEV=['maj7','m7','m7','maj7','7','m7','m7b5'];
const RN=['I','ii','iii','IV','V','vi','vii°'];

function spell(root){                 // proper #/b spelled major scale -> [{pc,name}]
 const acc=root.slice(1), rp=((LP[root[0]]+(acc==='#'?1:acc==='b'?-1:0))%12+12)%12, li=LETTERS.indexOf(root[0]);
 return MAJ.map((iv,i)=>{const L=LETTERS[(li+i)%7], t=(rp+iv)%12, d=((t-LP[L])%12+12)%12;
   return {pc:t, name:L+(d===0?'':d===1?'#':d===11?'b':d===2?'##':'bb')};});
}
function suffix(deg,type){
 if(type==='Triad')return TRIQ[deg-1];
 if(type==='7th')return SEV[deg-1];
 if(type==='6')return TRIQ[deg-1]+'6';
 if(type==='sus2'||type==='sus4')return type;
 if(type==='add9')return TRIQ[deg-1]+'add9';
 if(type==='9')return (deg===5?'9':TRIQ[deg-1]+'9');
 if(type==='11')return (deg===5?'11':TRIQ[deg-1]+'11');
 if(type==='13')return (deg===5?'13':TRIQ[deg-1]+'13');
 return '';
}
let ac=null;
function play(pcs){
 ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 pcs.forEach((midi,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';
  o.frequency.value=440*Math.pow(2,(midi-69)/12);const t=ac.currentTime+i*0.06;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.4);});
}
function render(){
 const key=document.getElementById('key').value, type=document.getElementById('type').value;
 const scale=spell(key), offs=TYPES[type];
 const wrap=document.getElementById('chords'); wrap.innerHTML='';
 for(let d=1; d<=7; d++){
   const tones=offs.map(o=>{const deg=((d-1+o)%7); const oct=Math.floor((d-1+o)/7);
     return {deg:deg+1, name:scale[deg].name, oct, pc:scale[deg].pc};});
   const tonicPc=((LP[key[0]]+(key.slice(1)==='#'?1:key.slice(1)==='b'?-1:0))%12+12)%12;
   const chordMidis=tones.map(t=>{let semi=(t.pc-tonicPc+12)%12; return 60+semi+t.oct*12;});
   const el=document.createElement('div'); el.className='chord';
   el.onclick=()=>play(chordMidis);
   const stack=tones.map(t=>`<div class="tone" style="background:${COL[t.deg-1]};color:${TXT[t.deg-1]}"><span class="n">${t.name}</span><span class="d">${t.deg}</span></div>`).join('');
   el.innerHTML=`<div class="name">${scale[d-1].name}${suffix(d,type)}</div><div class="rn">${RN[d-1]}</div><div class="stack">${stack}</div>`;
   wrap.appendChild(el);
 }
}
// init
const ks=document.getElementById('key'); KEYS.forEach(k=>ks.add(new Option(k+' major',k)));
const ts=document.getElementById('type'); Object.keys(TYPES).forEach(t=>ts.add(new Option(t,t)));
document.getElementById('legend').innerHTML=COL.map((c,i)=>`<span class="lg"><span class="sw" style="background:${c}"></span>${i+1}</span>`).join('');
ks.onchange=render; ts.onchange=render; render();
</script></body></html>
