<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hold Patterns</title>
<link rel="icon" id="gg-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6f5c'/%3E%3Ctext x='32' y='33' font-family='-apple-system,Helvetica,Arial,sans-serif' font-weight='800' font-size='30' fill='white' text-anchor='middle' dominant-baseline='central'%3EHP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fafaf7; --card:#fff; --ink:#151515; --mute:#8a8a85; --line:#e6e4dd; --soft:#f1efe8;
  --note:#c9c6bc; --hold:#c0392b; --tick:#d9d6cc;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --mute:#8d8c86; --line:#33322e; --soft:#2a2926;
  --note:#56544e; --hold:#ff6b5b; --tick:#3d3c37;
}}
:root[data-theme="dark"]{
  --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --mute:#8d8c86; --line:#33322e; --soft:#2a2926;
  --note:#56544e; --hold:#ff6b5b; --tick:#3d3c37;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:1fr 470px;grid-template-rows:auto 1fr;gap:12px 16px;padding:14px 16px;height:100vh;overflow:hidden}
header{grid-column:1 / span 2;display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700}
h1 a{font-size:12px;font-weight:500;color:var(--mute);margin-left:8px;text-decoration:none}
h1 a:hover{color:var(--ink)}
header p{font-size:12.5px;color:var(--mute);max-width:980px}
header p b{color:var(--ink);font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:0;overflow:hidden}
#left{display:flex;flex-direction:column;padding:14px 16px 12px;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer}
.tabs button span{color:var(--mute);font-size:12px;margin-left:5px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.on span{color:var(--bg);opacity:.7}
.cards{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:10px;min-height:0}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;background:var(--card);min-height:0}
.card:hover{border-color:var(--mute)}
.card.sel{outline:2.5px solid var(--ink);outline-offset:-1px}
.card .heat{position:absolute;inset:0;border-radius:9px;background:var(--ink);pointer-events:none}
.card h3{font-size:14px;font-weight:700;position:relative}
.card .n{font-size:22px;font-weight:750;position:relative;line-height:1}
.card .n small{font-size:11.5px;font-weight:500;color:var(--mute);margin-left:4px}
.card .d{font-size:11.5px;color:var(--mute);position:relative}
.glyph{flex:1;display:flex;align-items:flex-end;gap:5px;min-height:28px;max-height:64px;position:relative;margin:auto 0}
.glyph i{flex:1;max-width:22px;background:var(--hold);border-radius:3px 3px 0 0;opacity:.8}
.foot{font-size:12px;color:var(--mute)}
.foot b{color:var(--ink)}
/* side */
#side{display:flex;flex-direction:column}
.head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.head h2{font-size:20px;font-weight:750}
.head h2 span{font-size:12.5px;font-weight:500;color:var(--mute);margin-left:8px}
.head p{font-size:12.5px;color:var(--mute);margin-top:4px}
.head .key{display:flex;gap:12px;font-size:11.5px;color:var(--mute);margin-top:8px;align-items:center}
.head .key i{display:inline-block;width:18px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.songs{overflow:auto;flex:1;padding:2px 16px 12px}
.r{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.r .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .t b{font-weight:650}
.r .t em{font-style:normal;color:var(--mute);font-size:12px;margin-left:6px}
.r .h{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.r .h b{color:var(--hold);font-weight:700}
.r svg{grid-column:1 / span 2;width:100%;height:22px;display:block}
.r .m{grid-column:1;font-size:11.5px;color:var(--mute)}
.r .lk{grid-column:2;display:flex;gap:8px;justify-content:flex-end}
.r .lk a{font-size:11px;color:var(--mute);text-decoration:none}
.r .lk a:hover{color:var(--ink)}
.r.star{background:var(--soft);margin:0 -8px;padding:8px}
@media (max-width:820px){
  body{display:block;height:auto;overflow:auto;padding:12px 16px}
  header{margin-bottom:10px}
  .box{margin-bottom:12px}
  .cards{grid-template-columns:repeat(2,1fr);grid-template-rows:none}
  .card{min-height:110px}
  .songs{overflow:visible}
}
</style></head>
<body>
<header>
  <h1>Hold Patterns<a href="index.html">music index →</a></h1>
  <p>A melody reads by where it <b>lands</b>. Each section's first 8 bars, read as four 2-bar lines: the <b>longest note of each line</b>, held until the next note sounds. Straight Tequila Night's verse lands <b>1.5 · 4 · 2 · 4</b> beats: short line, long answer.</p>
</header>
<div id="left" class="box">
  <div class="tabs" id="tabs"></div>
  <div class="cards" id="cards"></div>
  <div class="foot" id="foot"></div>
</div>
<aside id="side" class="box"></aside>
<script>
const DATA = __DATA__;
const SHAPES = [
  ['call & answer', [1.5, 4, 1.5, 4], 'lines 2 and 4 land a beat or more longer than 1 and 3'],
  ['answer & call', [4, 1.5, 4, 1.5], 'lines 1 and 3 land longer: the long note comes first'],
  ['growing', [1.5, 2, 3, 4], 'each line holds at least as long as the last; the 4th a beat longer'],
  ['shrinking', [4, 3, 2, 1.5], 'each line holds no longer than the last; the 1st a beat longer'],
  ['long landing', [1.5, 2, 1.5, 4], 'the 4th line lands a beat longer than any before it'],
  ['long start', [4, 1.5, 2, 1.5], 'the 1st line holds a beat longer than any after it'],
  ['even', [2, 2, 2, 2], 'all four lines land within half a beat of each other'],
  ['mixed', [2, 3.5, 1.5, 2.5], 'none of the above'],
];
const KIND_NAME = {verse: 'Verse', chorus: 'Chorus', 'pre-chorus': 'Pre-chorus', bridge: 'Bridge'};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = x => (Math.round(x * 2) / 2).toString();
let kind = 'verse', shape = 'call & answer';

function rows(k, s){ return DATA.secs.filter(x => x[1] === k && (!s || x[5] === s)); }

function tabs(){
  document.getElementById('tabs').innerHTML = DATA.kinds.map(k =>
    `<button data-k="${k}" class="${k === kind ? 'on' : ''}">${KIND_NAME[k]}<span>${rows(k).length}</span></button>`).join('');
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { kind = b.dataset.k; draw(); });
}

function cards(){
  const all = rows(kind), max = Math.max(...SHAPES.map(s => rows(kind, s[0]).length));
  document.getElementById('cards').innerHTML = SHAPES.map(([name, ex, d]) => {
    const n = rows(kind, name).length, top = Math.max(...ex);
    return `<div class="card${name === shape ? ' sel' : ''}" data-s="${name}">
      <div class="heat" style="opacity:${n ? 0.02 + 0.12 * Math.sqrt(n / max) : 0}"></div>
      <h3>${name}</h3>
      <div class="glyph">${ex.map(v => `<i style="height:${Math.round(100 * v / top)}%"></i>`).join('')}</div>
      <div class="n">${n}<small>${Math.round(100 * n / all.length)}%</small></div>
      <div class="d">${d}</div></div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(c => c.onclick = () => { shape = c.dataset.s; draw(); });
  document.getElementById('foot').innerHTML = `<b>${all.length}</b> ${KIND_NAME[kind].toLowerCase()}s from <b>${new Set(all.map(x => x[0])).size}</b> songs · 4/4 only · the first ${KIND_NAME[kind].toLowerCase()} of each song · copies of a song collapse to the one with the most melody`;
}

// the section's first 8 bars as a strip: every note as long as it sounds, holds (1.5+ beats) in red
function strip(sec){
  const [, , , , , , t0, lens] = sec, W = 32;
  let t = t0, out = '';
  for (let k = 1; k < 4; k++) out += `<line x1="${k * 8 / W * 100}%" x2="${k * 8 / W * 100}%" y1="0" y2="22" stroke="var(--tick)" stroke-width="1"/>`;
  for (const v of lens){
    if (t >= W) break;
    if (v < 0){ t += -v; continue; }
    const s = Math.max(t, 0), e = Math.min(t + v, W);
    if (e > s){
      const hold = v >= 1.5;
      out += `<rect x="${s / W * 100}%" y="${hold ? 5 : 8}" width="calc(${(e - s) / W * 100}% - 1px)" height="${hold ? 12 : 6}" rx="2" fill="var(--${hold ? 'hold' : 'note'})"/>`;
    }
    t += v;
  }
  return `<svg preserveAspectRatio="none">${out}</svg>`;
}

function side(){
  const list = rows(kind, shape).slice().sort((a, b) => DATA.songs[a[0]].t.localeCompare(DATA.songs[b[0]].t) || DATA.songs[a[0]].a.localeCompare(DATA.songs[b[0]].a));
  const desc = SHAPES.find(s => s[0] === shape)[2];
  document.getElementById('side').innerHTML = `<div class="head">
      <h2>${shape}<span>${KIND_NAME[kind]} · ${list.length} ${list.length === 1 ? 'song' : 'songs'}</span></h2>
      <p>${desc}. The four numbers are each line's longest note, in beats.</p>
      <div class="key"><span><i style="background:var(--note)"></i>note, as long as it sounds</span><span><i style="background:var(--hold)"></i>hold, 1.5+ beats</span><span>| every 2 bars</span></div>
    </div>
    <div class="songs">${list.length ? list.map(x => {
      const s = DATA.songs[x[0]], top = Math.max(...x[4]);
      const star = /straight tequila/i.test(s.t) ? ' star' : '';
      return `<div class="r${star}">
        <div class="t"><b>${esc(s.t)}</b><em>${esc(s.a)}</em></div>
        <div class="h">${x[4].map(v => v === top ? `<b>${fmt(v)}</b>` : fmt(v)).join(' · ')}</div>
        ${strip(x)}
        <div class="m">${esc(x[2])} · ${x[3]} bars${s.bpm ? ' · ' + Math.round(s.bpm) + ' bpm' : ''}</div>
        <div class="lk">${s.u ? `<a href="https://hookpad.hooktheory.com/?idOfUserSong=${s.u}" target="_blank" rel="noopener">Hookpad ↗</a>` : ''}
          <a href="https://www.ultimate-guitar.com/search.php?search_type=title&value=${encodeURIComponent(s.a + ' ' + s.t)}" target="_blank" rel="noopener">UG ↗</a></div>
      </div>`;
    }).join('') : '<p style="padding:16px;color:var(--mute)">No sections in this shape.</p>'}</div>`;
}

function draw(){ tabs(); cards(); side(); }
draw();
</script>
</body></html>
