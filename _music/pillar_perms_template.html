<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pillar Perms</title>
<link rel="icon" id="gg-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d02828'/%3E%3Ctext x='32' y='33' font-family='-apple-system,Helvetica,Arial,sans-serif' font-weight='800' font-size='30' fill='white' text-anchor='middle' dominant-baseline='central'%3EPP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fafaf7; --card:#fff; --ink:#151515; --mute:#8a8a85; --line:#e6e4dd; --soft:#f1efe8;
  --d1:#d02828; --d4:#1f8a4c; --d5:#1663c7;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --mute:#8d8c86; --line:#33322e; --soft:#2a2926;
  --d1:#ff6b6b; --d4:#4cc27a; --d5:#5ea2ff;
}}
:root[data-theme="dark"]{
  --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --mute:#8d8c86; --line:#33322e; --soft:#2a2926;
  --d1:#ff6b6b; --d4:#4cc27a; --d5:#5ea2ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:1fr 430px;grid-template-rows:auto 1fr;gap:12px 16px;padding:14px 16px;height:100vh;overflow:hidden}
header{grid-column:1 / span 2;display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700}
h1 a{font-size:12px;font-weight:500;color:var(--mute);margin-left:8px;text-decoration:none}
h1 a:hover{color:var(--ink)}
header p{font-size:12.5px;color:var(--mute)}
header p b{color:var(--ink);font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:0;overflow:hidden}
#grid{display:flex;flex-direction:column;padding:14px 16px 12px;gap:8px}
.groups{display:grid;grid-template-columns:64px repeat(6,1fr);gap:10px}
.groups .half{grid-column:span 3;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);border-bottom:2px solid var(--line);padding-bottom:3px}
.groups .half b{color:var(--ink);letter-spacing:0;text-transform:none;font-size:12.5px;margin-right:6px}
.groups .g{font-size:11.5px;color:var(--mute);text-align:center}
.groups .g b{display:block;color:var(--ink);font-weight:650;font-size:12px}
.rows{flex:1;display:grid;grid-template-rows:repeat(3,1fr);gap:10px;min-height:0}
.row{display:grid;grid-template-columns:64px repeat(6,1fr);gap:10px;min-height:0}
.rl{display:flex;flex-direction:column;justify-content:center;font-size:11px;color:var(--mute);line-height:1.3}
.rl b{font-size:18px;font-weight:750}
.pair{display:grid;grid-template-rows:1fr 1fr;gap:6px;min-height:0}
.cell{border:1px solid var(--line);border-radius:9px;padding:7px 8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:0;position:relative;background:var(--card)}
.cell:hover{border-color:var(--mute)}
.cell.sel{outline:2.5px solid var(--ink);outline-offset:-1px}
.cell .heat{position:absolute;inset:0;border-radius:8px;background:var(--ink);pointer-events:none}
.cell .n{font-size:20px;font-weight:750;position:relative;line-height:1}
.cell .n small{font-size:11px;font-weight:500;color:var(--mute);margin-left:3px}
.cell.zero .n{color:var(--mute)}
.bars{display:flex;gap:2px;position:relative}
.bars span{flex:1;height:20px;border-radius:4px;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.c-I{background:var(--d1)} .c-IV{background:var(--d4)} .c-V{background:var(--d5)}
.foot{font-size:12px;color:var(--mute)}
.foot b{color:var(--ink)}
/* side panel */
#side{display:flex;flex-direction:column}
.head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.head .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.head .top b{font-size:22px;font-weight:750}
.head .top span{color:var(--mute);font-size:12.5px}
.head .bars span{height:40px;font-size:16px}
.head .sub{font-size:12.5px;color:var(--mute);margin-top:8px}
.rots{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center;font-size:12px;color:var(--mute)}
.rots button{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:1px 7px;cursor:pointer}
.rots button:hover{background:var(--soft)}
.songs{overflow:auto;flex:1;padding:2px 16px 12px}
.r{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:6px 0;border-bottom:1px solid var(--line)}
.r .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .t b{font-weight:650}
.r .t em{font-style:normal;color:var(--mute);font-size:12px;margin-left:6px}
.r .m{font-size:11.5px;color:var(--mute)}
.r .lk{grid-row:1 / span 2;grid-column:2;display:flex;gap:8px;align-items:center}
.r .lk a{font-size:11px;color:var(--mute);text-decoration:none}
.r .lk a:hover{color:var(--ink)}
.play{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:11px}
.play:hover,.play.on{background:var(--ink);color:var(--bg)}
.empty{color:var(--mute);padding:20px 16px;font-size:13px}
@media (max-width:820px){
  body{display:block;height:auto;overflow:auto;padding:12px 16px}
  header{margin-bottom:10px}
  .box{margin-bottom:12px}
  #grid{overflow-x:auto}
  .groups,.row{grid-template-columns:44px repeat(6,minmax(64px,1fr));gap:6px}
  .rows{grid-template-rows:none;gap:8px}
  .cell{min-height:58px}
  #side{max-height:none}
  .songs{overflow:visible}
}
</style></head>
<body>
<header>
  <h1>Pillar Perms<a href="index.html">music index →</a></h1>
  <p>Four bars of <b>I</b>, <b>IV</b> and <b>V</b>, one chord a bar, all three used: <b>36</b> orders. One chord is always doubled; the row says which, the column says where it sits.</p>
</header>
<div id="grid" class="box">
  <div class="groups" id="groups"></div>
  <div class="rows" id="rows"></div>
  <div class="foot" id="foot"></div>
</div>
<aside id="side" class="box"></aside>
<script>
const DATA = __DATA__;
const P = ['I', 'IV', 'V'];
const NOTES = {I: [0, 4, 7], IV: [5, 9, 12], V: [7, 11, 14]};
const LETTER = {I: 'C', IV: 'F', V: 'G'};
const key = o => o.join(' ');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// order -> its songs
const byOrder = DATA.orders.map(() => []);
for (const [o, si, sec, bar] of DATA.hits) byOrder[o].push({s: DATA.songs[si], sec, bar});
byOrder.forEach(l => l.sort((a, b) => a.s.t.localeCompare(b.s.t) || a.s.a.localeCompare(b.s.a)));
const idx = {}; DATA.orders.forEach((o, i) => idx[key(o)] = i);
const max = Math.max(...byOrder.map(l => l.length));

// placements of the doubled chord: held (next to each other) on the left, changing every bar on the right
const SPOTS = [[0, 1, 'bars 1–2'], [1, 2, 'bars 2–3'], [2, 3, 'bars 3–4'], [0, 2, 'bars 1 · 3'], [1, 3, 'bars 2 · 4'], [0, 3, 'bars 1 · 4']];
function orderFor(dbl, spot, flip){
  const rest = P.filter(c => c !== dbl); if (flip) rest.reverse();
  const o = []; o[spot[0]] = dbl; o[spot[1]] = dbl;
  let j = 0; for (let i = 0; i < 4; i++) if (!o[i]) o[i] = rest[j++];
  return o;
}
const bars = o => `<div class="bars">${o.map(c => `<span class="c-${c}">${c}</span>`).join('')}</div>`;

document.getElementById('groups').innerHTML = `<div></div>
  <div class="half"><b>Held</b>the doubled chord rings 2 bars</div>
  <div class="half"><b>Every bar changes</b>18 orders</div>
  <div></div>` + SPOTS.map(s => `<div class="g"><b>${s[2]}</b></div>`).join('');

let sel = idx['I V IV I'];
function drawGrid(){
  document.getElementById('rows').innerHTML = P.map(d => `<div class="row">
    <div class="rl"><b class="c-txt" style="color:var(--d${d === 'I' ? 1 : d === 'IV' ? 4 : 5})">${d}</b>twice</div>` +
    SPOTS.map(sp => `<div class="pair">${[0, 1].map(f => {
      const o = orderFor(d, sp, f), i = idx[key(o)], n = byOrder[i].length;
      return `<div class="cell${n ? '' : ' zero'}${i === sel ? ' sel' : ''}" data-i="${i}">
        <div class="heat" style="opacity:${n ? 0.03 + 0.17 * Math.sqrt(n / max) : 0}"></div>
        <div class="n">${n}<small>${n === 1 ? 'song' : 'songs'}</small></div>${bars(o)}</div>`;
    }).join('')}</div>`).join('') + `</div>`).join('');
  document.querySelectorAll('.cell').forEach(c => c.onclick = () => { sel = +c.dataset.i; drawGrid(); side(); });
  const songs = new Set(DATA.hits.map(h => h[1])).size;
  const heard = byOrder.filter(l => l.length).length;
  document.getElementById('foot').innerHTML = `<b>${heard}</b> of 36 heard in <b>${songs}</b> songs · major-key sections read in 4-bar blocks from their first bar · each song once per order · darker = more songs`;
}

function rotations(o){ const out = []; for (let i = 1; i < 4; i++) out.push(o.slice(i).concat(o.slice(0, i))); return out; }
function side(){
  const o = DATA.orders[sel], l = byOrder[sel];
  const loop = o[3] === o[0] ? 'Looped, bar 4 runs into bar 1 on the same chord: it holds across the seam.' : 'Looped, every change is a real change, the seam included.';
  const rots = [...new Set(rotations(o).map(key))].filter(k => k !== key(o));
  document.getElementById('side').innerHTML = `<div class="head">
      <div class="top"><button class="play" id="pl" title="play twice, in C">▶</button><b>${o.join(' ')}</b><span>${o.map(c => LETTER[c]).join(' ')} in C · ${l.length} ${l.length === 1 ? 'song' : 'songs'}</span></div>
      ${bars(o)}
      <div class="sub">${loop}</div>
      <div class="rots">same loop from another bar: ${rots.map(k => `<button data-k="${k}">${k} <b>${byOrder[idx[k]].length}</b></button>`).join('')}</div>
    </div>
    <div class="songs">${l.length ? l.map(h => `<div class="r">
      <div class="t"><b>${esc(h.s.t)}</b><em>${esc(h.s.a)}</em></div>
      <div class="m">${esc(h.sec)} · from bar ${h.bar} · ${esc(h.s.k)}${h.s.bpm ? ' · ' + Math.round(h.s.bpm) + ' bpm' : ''}</div>
      <div class="lk">${h.s.u ? `<a href="https://hookpad.hooktheory.com/?idOfUserSong=${h.s.u}" target="_blank" rel="noopener">Hookpad ↗</a>` : ''}
        <a href="https://www.ultimate-guitar.com/search.php?search_type=title&value=${encodeURIComponent(h.s.a + ' ' + h.s.t)}" target="_blank" rel="noopener">UG ↗</a></div>
    </div>`).join('') : '<div class="empty">No song in the library plays this order in a 4-bar block.</div>'}</div>`;
  document.getElementById('pl').onclick = e => play(o, e.currentTarget);
  document.querySelectorAll('.rots button').forEach(b => b.onclick = () => { sel = idx[b.dataset.k]; drawGrid(); side(); });
}

// ---- playback: the four bars twice, in C, 100 bpm ----
let ac = null, voices = [], playing = null, stopT = null;
function stop(){ voices.forEach(v => { try { v.stop(); } catch (e) {} }); voices = [];
  if (playing) playing.classList.remove('on'); playing = null; clearTimeout(stopT); }
function play(o, btn){
  if (playing === btn) { stop(); return; }
  stop();
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const bar = 4 * 60 / 100;
  let t = ac.currentTime + 0.05;
  for (let pass = 0; pass < 2; pass++) o.forEach(c => {
    [NOTES[c][0] - 12, ...NOTES[c]].forEach(semi => {
      const osc = ac.createOscillator(), v = ac.createGain();
      osc.type = 'triangle'; osc.frequency.value = 261.63 * Math.pow(2, semi / 12);
      v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(0.08, t + 0.02);
      v.gain.setTargetAtTime(0.04, t + 0.1, 0.5); v.gain.setTargetAtTime(0, t + bar - 0.06, 0.02);
      osc.connect(v).connect(ac.destination); osc.start(t); osc.stop(t + bar + 0.1); voices.push(osc);
    });
    t += bar;
  });
  playing = btn; btn.classList.add('on');
  stopT = setTimeout(stop, (t - ac.currentTime) * 1000 + 100);
}

drawGrid(); side();
</script>
</body></html>
