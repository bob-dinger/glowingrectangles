<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nineteen — Chord Permutation Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
}

.layout {
    display: flex;
    height: 100vh;
}

/* ---- Left Sidebar ---- */
.sidebar {
    width: 240px;
    min-width: 240px;
    background: #16162a;
    border-right: 1px solid #2a2a4a;
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    padding: 16px 14px 12px;
    border-bottom: 1px solid #2a2a4a;
}

.sidebar-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #6a6a8a;
    margin-bottom: 10px;
}

.search-box {
    width: 100%;
    padding: 7px 10px;
    background: #1e1e3a;
    border: 1px solid #2a2a4a;
    border-radius: 5px;
    color: #e0e0e0;
    font-size: 12px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
}

.search-box:focus {
    border-color: #6366f1;
}

.search-box::placeholder {
    color: #4a4a6a;
}

.perm-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
}

.perm-list::-webkit-scrollbar {
    width: 6px;
}

.perm-list::-webkit-scrollbar-track {
    background: transparent;
}

.perm-list::-webkit-scrollbar-thumb {
    background: #2a2a4a;
    border-radius: 3px;
}

.perm-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.1s;
    font-size: 12px;
}

.perm-item:hover {
    background: #1e1e3a;
}

.perm-item.active {
    background: #1e1e3a;
    border-left: 3px solid #6366f1;
    padding-left: 11px;
}

.perm-chip {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    min-width: 0;
}

.perm-sep {
    color: #3a3a5a;
    font-size: 10px;
}

.sidebar-footer {
    padding: 10px 14px;
    font-size: 11px;
    color: #4a4a6a;
    border-top: 1px solid #2a2a4a;
}

/* ---- Center Area ---- */
.center {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 32px;
    overflow: hidden;
}

.center-header {
    margin-bottom: 20px;
}

.center-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
}

.center-subtitle {
    font-size: 13px;
    color: #6a6a8a;
}

/* ---- Beat Grid ---- */
.grid-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
}

.phrase-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
    border-left: 3px solid;
    padding: 6px 8px;
    border-radius: 5px;
    position: relative;
    height: 44px;
    min-height: 44px;
}

.phrase-row-A { border-left-color: rgba(60, 120, 220, 0.7); background: rgba(60, 120, 220, 0.06); }
.phrase-row-B { border-left-color: rgba(220, 90, 80, 0.7); background: rgba(220, 90, 80, 0.06); }
.phrase-row-C { border-left-color: rgba(50, 180, 80, 0.7); background: rgba(50, 180, 80, 0.06); }

.phrase-label {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.5;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    width: 14px;
}

.beat-area {
    flex: 1;
    position: relative;
    min-width: 0;
}

.beat-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(255, 255, 255, 0.05);
    pointer-events: none;
    z-index: 1;
}

.beat-line.measure {
    background: rgba(255, 255, 255, 0.12);
}

.chord-row {
    display: grid;
    grid-template-columns: repeat(32, 1fr);
    height: 100%;
    position: relative;
    z-index: 2;
}

.chord-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    min-width: 0;
    white-space: nowrap;
    margin: 0 1px;
    transition: outline 0.1s, filter 0.1s;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chord-cell.playing {
    outline: 2px solid rgba(255, 255, 255, 0.6);
    outline-offset: -1px;
    filter: brightness(1.3);
}

.cursor-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(99, 102, 241, 0.8);
    pointer-events: none;
    z-index: 10;
    display: none;
    border-radius: 1px;
    box-shadow: 0 0 6px rgba(99, 102, 241, 0.5);
}

/* ---- Controls ---- */
.controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #2a2a4a;
}

.play-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #6366f1;
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
}

.play-btn:hover {
    background: #818cf8;
}

.play-btn:active {
    transform: scale(0.95);
}

.tempo-control {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 300px;
}

.tempo-label {
    font-size: 12px;
    color: #6a6a8a;
    flex-shrink: 0;
    min-width: 75px;
}

.tempo-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: #2a2a4a;
    border-radius: 2px;
    outline: none;
}

.tempo-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #6366f1;
    cursor: pointer;
    transition: background 0.15s;
}

.tempo-slider::-webkit-slider-thumb:hover {
    background: #818cf8;
}

.beat-counter {
    font-size: 12px;
    color: #4a4a6a;
    font-variant-numeric: tabular-nums;
    min-width: 90px;
    text-align: right;
}

/* ---- Degree colors ---- */
.deg-1 { background: rgba(220, 60, 60, 0.25); color: #ffa0a0; }
.deg-2 { background: rgba(230, 140, 40, 0.25); color: #ffc888; }
.deg-3 { background: rgba(220, 200, 40, 0.25); color: #f0e888; }
.deg-4 { background: rgba(50, 180, 80, 0.25); color: #88e8a0; }
.deg-5 { background: rgba(60, 120, 220, 0.25); color: #90b8f8; }
.deg-6 { background: rgba(160, 80, 220, 0.25); color: #d0a0f8; }
</style>
</head>
<body>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Permutations</div>
            <input type="text" class="search-box" id="searchBox" placeholder="Search chords...">
        </div>
        <div class="perm-list" id="permList"></div>
        <div class="sidebar-footer" id="sidebarFooter">360 permutations</div>
    </div>

    <div class="center">
        <div class="center-header">
            <div class="center-title">Nineteen</div>
            <div class="center-subtitle" id="currentLabel">ABAC Verse — C · Dm · F · G</div>
        </div>

        <div class="grid-container" id="gridContainer"></div>

        <div class="controls">
            <button class="play-btn" id="playBtn">&#9654;</button>
            <div class="tempo-control">
                <label class="tempo-label" id="tempoLabel">120 BPM</label>
                <input type="range" class="tempo-slider" id="tempoSlider" min="60" max="180" value="120">
            </div>
            <div class="beat-counter" id="beatCounter">Measure 1 / 16</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.3.5/Tone.js"></script>
<script>
// ---- Data Model ----

const CHORDS = [
    { deg: 1, numeral: 'I',   name: 'C',  notes: ['C4','E4','G4'],  bass: 'C3' },
    { deg: 2, numeral: 'ii',  name: 'Dm', notes: ['D4','F4','A4'],  bass: 'D3' },
    { deg: 3, numeral: 'iii', name: 'Em', notes: ['E4','G4','B4'],  bass: 'E3' },
    { deg: 4, numeral: 'IV',  name: 'F',  notes: ['F4','A4','C5'],  bass: 'F3' },
    { deg: 5, numeral: 'V',   name: 'G',  notes: ['G4','B4','D5'],  bass: 'G3' },
    { deg: 6, numeral: 'vi',  name: 'Am', notes: ['A3','C4','E4'],  bass: 'A2' }
];

// Template: 18 chord events derived from Hookpad JSON
// Beats are 0-based (offset by 16 from Hookpad's 1-based counting + pickup)
// Roles: 1, 2, 4, 5 → mapped to 4 distinct chords per permutation
const TEMPLATE = [
    // Phrase A1 (beats 0–16)
    { role: 1, beat: 0,    dur: 2,   phrase: 'A', phraseIdx: 0 },
    { role: 1, beat: 2,    dur: 1.5, phrase: 'A', phraseIdx: 0 },
    { role: 5, beat: 3.5,  dur: 4.5, phrase: 'A', phraseIdx: 0 },
    { role: 1, beat: 8,    dur: 3,   phrase: 'A', phraseIdx: 0 },
    { role: 5, beat: 11,   dur: 5,   phrase: 'A', phraseIdx: 0 },
    // Phrase B (beats 16–32)
    { role: 2, beat: 16,   dur: 3.5, phrase: 'B', phraseIdx: 1 },
    { role: 4, beat: 19.5, dur: 4.5, phrase: 'B', phraseIdx: 1 },
    { role: 1, beat: 24,   dur: 3.5, phrase: 'B', phraseIdx: 1 },
    { role: 5, beat: 27.5, dur: 4.5, phrase: 'B', phraseIdx: 1 },
    // Phrase A2 (beats 32–48)
    { role: 1, beat: 32,   dur: 2,   phrase: 'A', phraseIdx: 2 },
    { role: 1, beat: 34,   dur: 1.5, phrase: 'A', phraseIdx: 2 },
    { role: 5, beat: 35.5, dur: 4.5, phrase: 'A', phraseIdx: 2 },
    { role: 1, beat: 40,   dur: 3.5, phrase: 'A', phraseIdx: 2 },
    { role: 5, beat: 43.5, dur: 4.5, phrase: 'A', phraseIdx: 2 },
    // Phrase C (beats 48–64)
    { role: 2, beat: 48,   dur: 3.5, phrase: 'C', phraseIdx: 3 },
    { role: 4, beat: 51.5, dur: 4.5, phrase: 'C', phraseIdx: 3 },
    { role: 2, beat: 56,   dur: 3.5, phrase: 'C', phraseIdx: 3 },
    { role: 5, beat: 59.5, dur: 4.5, phrase: 'C', phraseIdx: 3 }
];

const PHRASES = [
    { label: 'A', startBeat: 0,  endBeat: 16, cls: 'A' },
    { label: 'B', startBeat: 16, endBeat: 32, cls: 'B' },
    { label: 'A', startBeat: 32, endBeat: 48, cls: 'A' },
    { label: 'C', startBeat: 48, endBeat: 64, cls: 'C' }
];

const ROLE_MAP = [1, 2, 4, 5]; // the 4 abstract roles

// ---- Generate P(6,4) = 360 permutations ----

function generatePerms() {
    const perms = [];
    for (let a = 0; a < 6; a++)
    for (let b = 0; b < 6; b++) {
        if (b === a) continue;
        for (let c = 0; c < 6; c++) {
            if (c === a || c === b) continue;
            for (let d = 0; d < 6; d++) {
                if (d === a || d === b || d === c) continue;
                perms.push({
                    mapping: { 1: CHORDS[a], 2: CHORDS[b], 4: CHORDS[c], 5: CHORDS[d] },
                    chords: [CHORDS[a], CHORDS[b], CHORDS[c], CHORDS[d]],
                    label: [CHORDS[a].name, CHORDS[b].name, CHORDS[c].name, CHORDS[d].name].join(' · ')
                });
            }
        }
    }
    return perms;
}

const allPerms = generatePerms();
let filteredPerms = allPerms;
let selectedIdx = 0;

// ---- Sidebar Rendering ----

const permListEl = document.getElementById('permList');
const searchBoxEl = document.getElementById('searchBox');
const sidebarFooterEl = document.getElementById('sidebarFooter');

function renderPermList() {
    permListEl.innerHTML = '';
    filteredPerms.forEach((perm, i) => {
        const item = document.createElement('div');
        item.className = 'perm-item' + (i === selectedIdx ? ' active' : '');
        item.dataset.idx = i;

        perm.chords.forEach((ch, ci) => {
            if (ci > 0) {
                const sep = document.createElement('span');
                sep.className = 'perm-sep';
                sep.textContent = '·';
                item.appendChild(sep);
            }
            const chip = document.createElement('span');
            chip.className = 'perm-chip deg-' + ch.deg;
            chip.textContent = ch.name;
            item.appendChild(chip);
        });

        item.onclick = () => selectPerm(i);
        permListEl.appendChild(item);
    });
    sidebarFooterEl.textContent = filteredPerms.length + ' permutation' + (filteredPerms.length !== 1 ? 's' : '');
}

function selectPerm(idx) {
    if (isPlaying) stopPlayback();
    selectedIdx = idx;
    // Update active class
    permListEl.querySelectorAll('.perm-item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
    });
    renderGrid();
    updateLabel();
}

function scrollToActive() {
    const active = permListEl.querySelector('.perm-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
}

searchBoxEl.addEventListener('input', () => {
    const q = searchBoxEl.value.trim().toLowerCase();
    if (!q) {
        filteredPerms = allPerms;
    } else {
        filteredPerms = allPerms.filter(p =>
            p.chords.some(ch => ch.name.toLowerCase().includes(q))
        );
    }
    selectedIdx = 0;
    renderPermList();
    if (filteredPerms.length > 0) {
        renderGrid();
        updateLabel();
    }
});

// ---- Grid Rendering ----

const gridContainerEl = document.getElementById('gridContainer');
const currentLabelEl = document.getElementById('currentLabel');

function updateLabel() {
    const perm = filteredPerms[selectedIdx];
    if (!perm) return;
    currentLabelEl.textContent = 'ABAC Verse — ' + perm.label;
}

function renderGrid() {
    const perm = filteredPerms[selectedIdx];
    if (!perm) {
        gridContainerEl.innerHTML = '<div style="color:#4a4a6a;font-size:13px;padding:20px;">No permutations match.</div>';
        return;
    }

    gridContainerEl.innerHTML = '';

    PHRASES.forEach((ph, phIdx) => {
        const row = document.createElement('div');
        row.className = 'phrase-row phrase-row-' + ph.cls;
        row.dataset.phraseIdx = phIdx;

        const label = document.createElement('span');
        label.className = 'phrase-label';
        label.textContent = ph.label;
        row.appendChild(label);

        const beatArea = document.createElement('div');
        beatArea.className = 'beat-area';

        // Beat lines (16 beats per phrase, lines at each beat)
        for (let b = 1; b < 16; b++) {
            const line = document.createElement('div');
            line.className = 'beat-line' + (b % 4 === 0 ? ' measure' : '');
            line.style.left = (b / 16 * 100) + '%';
            beatArea.appendChild(line);
        }

        // Chord grid row
        const chordRow = document.createElement('div');
        chordRow.className = 'chord-row';

        // Get events for this phrase
        const events = TEMPLATE.filter(e => e.phraseIdx === phIdx);
        events.forEach((evt, evtIdx) => {
            const chord = perm.mapping[evt.role];
            const cell = document.createElement('div');
            const spanCols = Math.round(evt.dur * 2);
            cell.className = 'chord-cell deg-' + chord.deg;
            cell.style.gridColumn = 'span ' + spanCols;
            cell.textContent = chord.name;
            cell.dataset.eventBeat = evt.beat;
            cell.dataset.eventDur = evt.dur;
            chordRow.appendChild(cell);
        });

        beatArea.appendChild(chordRow);

        // Cursor line
        const cursor = document.createElement('div');
        cursor.className = 'cursor-line';
        beatArea.appendChild(cursor);

        row.appendChild(beatArea);
        gridContainerEl.appendChild(row);
    });
}

// ---- Tone.js Playback ----

let synth = null;
let bassSynth = null;
let isPlaying = false;
let animFrameId = null;

const playBtnEl = document.getElementById('playBtn');
const tempoSliderEl = document.getElementById('tempoSlider');
const tempoLabelEl = document.getElementById('tempoLabel');
const beatCounterEl = document.getElementById('beatCounter');

function ensureSynths() {
    if (synth) return;
    synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.8 },
        volume: -10
    }).toDestination();

    bassSynth = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.02, decay: 0.4, sustain: 0.5, release: 1.0 },
        volume: -14
    }).toDestination();
}

function beatsToTransportTime(beat) {
    const measures = Math.floor(beat / 4);
    const remainder = beat - measures * 4;
    const quarters = Math.floor(remainder);
    const sixteenths = (remainder - quarters) * 4;
    return measures + ':' + quarters + ':' + sixteenths;
}

function scheduleEvents() {
    const perm = filteredPerms[selectedIdx];
    if (!perm) return;

    Tone.Transport.cancel();

    TEMPLATE.forEach((evt, i) => {
        const chord = perm.mapping[evt.role];
        const time = beatsToTransportTime(evt.beat);
        const durSec = Tone.Time(beatsToTransportTime(evt.dur)).toSeconds();

        Tone.Transport.schedule(t => {
            synth.triggerAttackRelease(chord.notes, durSec * 0.9, t);
            bassSynth.triggerAttackRelease(chord.bass, durSec * 0.9, t);

            Tone.Draw.schedule(() => {
                highlightChord(evt.beat, evt.phraseIdx);
            }, t);
        }, time);
    });

    // Auto-stop at beat 64
    const endTime = beatsToTransportTime(64);
    Tone.Transport.schedule(() => {
        Tone.Draw.schedule(() => {
            stopPlayback();
        });
    }, endTime);
}

function highlightChord(beat, phraseIdx) {
    // Clear previous highlights
    gridContainerEl.querySelectorAll('.chord-cell.playing').forEach(el => el.classList.remove('playing'));

    // Find and highlight the current chord cell
    const row = gridContainerEl.querySelector(`.phrase-row[data-phrase-idx="${phraseIdx}"]`);
    if (!row) return;

    const cells = row.querySelectorAll('.chord-cell');
    cells.forEach(cell => {
        const cellBeat = parseFloat(cell.dataset.eventBeat);
        const cellDur = parseFloat(cell.dataset.eventDur);
        if (beat >= cellBeat && beat < cellBeat + cellDur) {
            cell.classList.add('playing');
        }
    });
}

function updateCursor() {
    if (!isPlaying) return;

    const seconds = Tone.Transport.seconds;
    const bpm = Tone.Transport.bpm.value;
    const currentBeat = (seconds * bpm) / 60;

    // Update beat counter
    const measure = Math.floor(currentBeat / 4) + 1;
    if (measure <= 16) {
        beatCounterEl.textContent = 'Measure ' + Math.min(measure, 16) + ' / 16';
    }

    // Update cursor lines
    const rows = gridContainerEl.querySelectorAll('.phrase-row');
    rows.forEach((row, i) => {
        const ph = PHRASES[i];
        const cursor = row.querySelector('.cursor-line');
        if (currentBeat >= ph.startBeat && currentBeat < ph.endBeat) {
            const progress = (currentBeat - ph.startBeat) / (ph.endBeat - ph.startBeat);
            cursor.style.display = 'block';
            cursor.style.left = (progress * 100) + '%';
        } else {
            cursor.style.display = 'none';
        }
    });

    animFrameId = requestAnimationFrame(updateCursor);
}

async function startPlayback() {
    await Tone.start();
    ensureSynths();
    Tone.Transport.bpm.value = parseInt(tempoSliderEl.value);
    Tone.Transport.position = '0:0:0';
    scheduleEvents();
    Tone.Transport.start();
    isPlaying = true;
    playBtnEl.innerHTML = '&#9632;'; // stop icon
    beatCounterEl.textContent = 'Measure 1 / 16';
    animFrameId = requestAnimationFrame(updateCursor);
}

function stopPlayback() {
    Tone.Transport.stop();
    Tone.Transport.cancel();
    isPlaying = false;
    playBtnEl.innerHTML = '&#9654;'; // play icon

    // Clear all highlights and cursors
    gridContainerEl.querySelectorAll('.chord-cell.playing').forEach(el => el.classList.remove('playing'));
    gridContainerEl.querySelectorAll('.cursor-line').forEach(el => el.style.display = 'none');

    if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
    }
    beatCounterEl.textContent = 'Measure 1 / 16';
}

playBtnEl.addEventListener('click', () => {
    if (isPlaying) {
        stopPlayback();
    } else {
        startPlayback();
    }
});

tempoSliderEl.addEventListener('input', () => {
    const bpm = parseInt(tempoSliderEl.value);
    tempoLabelEl.textContent = bpm + ' BPM';
    if (isPlaying) {
        Tone.Transport.bpm.value = bpm;
    }
});

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', (e) => {
    if (e.target === searchBoxEl) return;
    if (e.code === 'Space') {
        e.preventDefault();
        if (isPlaying) stopPlayback();
        else startPlayback();
    }
});

// ---- Init ----
renderPermList();
renderGrid();
updateLabel();
scrollToActive();
</script>

</body>
</html>
