<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, sans-serif; font-size: 13px; overflow: hidden; }
.topnav { display: flex; gap: 2px; background: #0f0f1f; padding: 6px 10px; border-bottom: 1px solid #2a2a4a; flex-wrap: wrap; }

.song-header .transport { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.song-header .transport button { background: #2a2a4a; color: #e0e0e0; border: 1px solid #3a3a5a; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
.song-header .transport button:hover { background: #3a3a5a; }
.song-header .transport button.playing { background: #6e16a5; border-color: #8e26c5; }
.song-header .transport .tempo-input { width: 50px; background: #16162a; color: #e0e0e0; border: 1px solid #3a3a5a; border-radius: 4px; padding: 4px; text-align: center; font-size: 12px; }
.song-header .transport label { font-size: 11px; color: #8a8ab0; display: flex; align-items: center; gap: 4px; }

.main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px; }
</style>

:"alan-jackson_gone-country"},{"title":"heart and soul","artist":"t' pau","slug":"t-pau_heart-and-soul"},{"title":"hey hey what can i do","artist":"led zeppelin","slug":"led-zeppelin_hey-hey-what-can-i-do_o"},{"title":"hot n cold","artist":"katy perry","slug":"katy-perry_hot-n-cold_o"},{"title":"i stay away","artist":"alice in chains","slug":"alice-in-chains_i-stay-away"},{"title":"it's the same old song","artist":"four tops","slug":"four-tops_its-the-same-old-song"},{"title":"keep it warm","artist":"flo and eddie","slug":"flo-and-eddie_keep-it-warm"},{"title":"kiss from a rose","artist":"seal","slug":"seal_kiss-from-a-rose"},{"title":"la grange","artist":"zz top","slug":"zz-top_la-grange"},{"title":"last friday night","artist":"katy perry","slug":"katy-perry_last-friday-night_o"},{"title":"last train to clarksville","artist":"monkees","slug":"monkees_last-train-to-clarksville"},{"title":"man on the moon","artist":"rem","slug":"rem_man-on-the-moon_o"},{"title":"messy","artist":"lola young","slug":"lola-young_messy"},{"title":"one last time","artist":"ariana grande","slug":"ariana-grande_one-last-time"},{"title":"peaches","artist":"presidents of the usa","slug":"presidents-of-the-usa_peaches_o"},{"title":"rockin pneumonia","artist":"johnny rivers","slug":"johnny-rivers_rockin-pneumonia"},{"title":"sharp dressed man","artist":"zz top","slug":"zz-top_sharp-dressed-man"},{"title":"she sells sanctuary","artist":"the cult","slug":"the-cult_she-sells-sanctuary"},{"title":"shimmer","artist":"fuel","slug":"fuel_shimmer_o"},{"title":"shouldve been a cowboy","artist":"toby keith","slug":"toby-keith_shouldve-been-a-cowboy"},{"title":"simple kind of life","artist":"no doubt","slug":"no-doubt_simple-kind-of-life_o"},{"title":"steal my sunshine","artist":"len","slug":"len_steal-my-sunshine"},{"title":"sultans of swing","artist":"dire straits","slug":"dire-straits_sultans-of-swing"},{"title":"take me home country roads","artist":"john denver","slug":"john-denver_take-me-home-country-roads"},{"title":"thats all","artist":"genesis","slug":"genesis_thats-all_o"},{"title":"the impression that i get","artist":"mighty mighty bosstones","slug":"mighty-mighty-bosstones_the-impression-that-i-get"},{"title":"the wind","artist":"cat stevens","slug":"cat-stevens_the-wind"},{"title":"time","artist":"hootie","slug":"hootie_time-360204"},{"title":"what its like","artist":"everlast","slug":"everlast_what-its-like_j"}];
const sb = window.supabase.createClient('https://eazzqlyfcnnlplobgaas.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhenpxbHlmY25ubHBsb2JnYWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTI4MTkxMzAsImV4cCI6MjAwODM5NTEzMH0.3SUQeAewAyOzlNCUGTLx8E1hnDg7oD2CwymuK3s4wxE');
const viewer = new SongViewer({
  supabase: sb,
  mainEl: '#main',
  headerEls: { title: '#songTitle', artist: '#songArtist', meta: '#songMeta' },
  transport: { playBtn: '#playBtn', stopBtn: '#stopBtn', tempoInput: '#tempoInput', displaySelect: '#displaySelect' },
});

function renderList(filter) {
  const list = document.getElementById('songlist');
  const norm = filter ? filter.toLowerCase().trim() : '';
  list.innerHTML = SONGS.map((s, i) => {
    const text = `${s.title} ${s.artist}`.toLowerCase();
    if (norm && !text.includes(norm)) return '';
    return `<div class="song-item ${s.slug ? '' : 'missing'}" data-idx="${i}">
      <div class="title">${s.title}</div>
      <div class="artist">${s.artist}${s.slug ? '' : ' · missing'}</div>
    </div>`;
  }).join('');
}

document.getElementById('search').oninput = (e) => renderList(e.target.value);

document.getElementById('songlist').addEventListener('click', (e) => {
  const item = e.target.closest('.song-item');
  if (!item) return;
  const idx = parseInt(item.dataset.idx);
  const song = SONGS[idx];
  document.querySelectorAll('.song-item.active').forEach(el => el.classList.remove('active'));
  item.classList.add('active');
  if (!song.slug) {
    document.getElementById('main').innerHTML = `<div class="status"><b>${song.title}</b> by ${song.artist}<br><br>not in library yet.</div>`;
    document.getElementById('songTitle').textContent = song.title;
    document.getElementById('songArtist').textContent = song.artist;
    document.getElementById('songMeta').textContent = '';
    return;
  }
  viewer.load(song.slug);
});

renderList('');
// Auto-load first available song
const firstWithSlug = SONGS.findIndex(s => s.slug);
if (firstWithSlug >= 0) {
  document.querySelectorAll('.song-item')[firstWithSlug]?.click();
}
</script>
