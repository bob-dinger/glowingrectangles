<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, sans-serif; font-size: 13px; overflow: hidden; }
.topnav { display: flex; gap: 2px; background: #0f0f1f; padding: 6px 10px; border-bottom: 1px solid #2a2a4a; flex-wrap: wrap; }

.song-header .transport button:hover { background: #3a3a5a; }
.song-header .transport button.playing { background: #6e16a5; border-color: #8e26c5; }
.song-header .transport .tempo-input { width: 50px; background: #16162a; color: #e0e0e0; border: 1px solid #3a3a5a; border-radius: 4px; padding: 4px; text-align: center; font-size: 12px; }
.song-header .transport label { font-size: 11px; color: #8a8ab0; display: flex; align-items: center; gap: 4px; }

.main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px; }
</style>

","slug":"michael-jackson_man-in-the-mirror_o_c_ly"},{"title":"mr brightside","artist":"the killers","slug":"killers_mr-brightside"},{"title":"nothing else matters","artist":"metallica","slug":"metallica_nothing-else-matters_o"},{"title":"polly","artist":"nirvana","slug":"nirvana_polly"},{"title":"pompeii","artist":"bastille","slug":"bastille_pompeii_o"},{"title":"ray of light","artist":"madonna","slug":"madonna_ray-of-light_o_c_ly"},{"title":"riptide","artist":"vance joy","slug":"vance-joy_riptide_o"},{"title":"set fire to the rain","artist":"adele","slug":"adele_set-fire-to-the-rain_o"},{"title":"seven nation army","artist":"the white stripes","slug":"white-stripes_seven-nation-army"},{"title":"she will be loved","artist":"maroon 5","slug":"maroon-5_she-will-be-loved_o"},{"title":"slide","artist":"goo goo dolls","slug":"goo-goo-dolls_slide_o_c_ly"},{"title":"starlight","artist":"muse","slug":"muse_starlight_o_c_ly"},{"title":"start me up","artist":"the rolling stones","slug":"rolling-stones_start-me-up"},{"title":"stuck in the middle with you","artist":"stealers wheel","slug":"steelers-wheel_stuck-in-the-middle-with-you"},{"title":"summer of 69","artist":"bryan adams","slug":"bryan-adams_summer-of-69_o_c_ly"},{"title":"take me home tonight","artist":"eddie money","slug":"eddie-money_take-me-home-tonight_o_c_ly"},{"title":"the way","artist":"fastball","slug":"fastball_the-way"},{"title":"the world has turned and left me here","artist":"weezer","slug":"weezer_the-world-has-turned-and-left-me-here_o"},{"title":"walking in memphis","artist":"marc cohn","slug":"marc-cohn_walking-in-memphis_o_c_ly"},{"title":"waterloo","artist":"abba","slug":"abba_waterloo"},{"title":"when you were young","artist":"the killers","slug":"killers_when-you-were-young"},{"title":"white flag","artist":"dido","slug":"dido_white-flag_o"},{"title":"wide awake","artist":"katy perry","slug":"katy-perry_wide-awake"},{"title":"wildest dreams","artist":"taylor swift","slug":"taylor-swift_wildest-dreams"},{"title":"you really got me now","artist":"the kinks","slug":"kinks_you-really-got-me-now_o"},{"title":"youre a god","artist":"vertical horizon","slug":"vertical-horizon_youre-a-god"},{"title":"youre so vain","artist":"carly simon","slug":"carly-simon_youre-so-vain_o_c_ly"}];
const sb = window.supabase.createClient('https://eazzqlyfcnnlplobgaas.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhenpxbHlmY25ubHBsb2JnYWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTI4MTkxMzAsImV4cCI6MjAwODM5NTEzMH0.3SUQeAewAyOzlNCUGTLx8E1hnDg7oD2CwymuK3s4wxE');
const viewer = new SongViewer({
  supabase: sb,
  mainEl: '#main',
  headerEls: { title: '#songTitle', artist: '#songArtist', meta: '#songMeta' },
  transport: { playBtn: '#playBtn', stopBtn: '#stopBtn', tempoInput: '#tempoInput', displaySelect: '#displaySelect' },
});

function renderList(filter) {
  const list = document.getElementById('songlist');
  const norm = filter ? filter.toLowerCase().trim() : '';
  list.innerHTML = SONGS.map((s, i) => {
    const text = `${s.title} ${s.artist}`.toLowerCase();
    if (norm && !text.includes(norm)) return '';
    return `<div class="song-item ${s.slug ? '' : 'missing'}" data-idx="${i}">
      <div class="title">${s.title}</div>
      <div class="artist">${s.artist}${s.slug ? '' : ' · missing'}</div>
    </div>`;
  }).join('');
}

document.getElementById('search').oninput = (e) => renderList(e.target.value);

document.getElementById('songlist').addEventListener('click', (e) => {
  const item = e.target.closest('.song-item');
  if (!item) return;
  const idx = parseInt(item.dataset.idx);
  const song = SONGS[idx];
  document.querySelectorAll('.song-item.active').forEach(el => el.classList.remove('active'));
  item.classList.add('active');
  if (!song.slug) {
    document.getElementById('main').innerHTML = `<div class="status"><b>${song.title}</b> by ${song.artist}<br><br>not in library yet.</div>`;
    document.getElementById('songTitle').textContent = song.title;
    document.getElementById('songArtist').textContent = song.artist;
    document.getElementById('songMeta').textContent = '';
    return;
  }
  viewer.load(song.slug);
});

renderList('');
// Auto-load first available song
const firstWithSlug = SONGS.findIndex(s => s.slug);
if (firstWithSlug >= 0) {
  document.querySelectorAll('.song-item')[firstWithSlug]?.click();
}
</script>
